  T18:
    title: "Compatibility contract and VS Code client alignment"
    repo: domainforge-vsc-extension
    initial_status: blocked
    depends_on: ["T09", "T11"]
    proof_level: P2
    confirmation: peer

    settles:
      - "REQ-COMPAT-003"
      - "REQ-COMPAT-004"
      - "REQ-VSC-002"

    changes: >-
      Versions and namespaces the custom method surface; preserves or migrates
      sea/astJson; removes textDocument/hoverPlus; documents the
      server<->client contract; adds client views consuming server projections.

    proves: >-
      Existing client functionality is preserved or migrated deliberately, the
      client detects a server contract-version mismatch, and no client
      re-derives semantics.

    does_not_prove: >-
      That the client is feature-complete; advanced views are incremental.

    hot_context:
      - "OBSERVED: the extension calls ONLY `sea/astJson`, in two commands (showAstJson, copyAstJson). It never calls textDocument/hoverPlus."
      - "OBSERVED DEFECT: `textDocument/hoverPlus` occupies the textDocument/ namespace the server does not own and has no consumer (FM-UNUSED-SURFACE). Remove or rename to domainforge/semanticInfo."
      - "OBSERVED: the extension IS actively released — v0.1.0, Open VSX, release.yml + ci.yml. Coordinated releases ARE available, so preserving sea/astJson is a choice, not a constraint."
      - "OBSERVED settings that must keep working: domainforge.server.path, domainforge.formatting.*, domainforge.mcp.*."
      - "SPEC REQ-VSC-002: client views consume server data; they must not parse .sea or query sxr directly."

    steps:
      - "Namespace all custom methods under domainforge/*; advertise them in the initialize result for detection."
      - "Implement version negotiation: the client checks the server's advertised contract version and degrades or warns on mismatch instead of assuming compatibility."
      - "Remove textDocument/hoverPlus; provide domainforge/semanticInfo if a consumer exists."
      - "Write .agent/reports/T18-client-contract.md documenting every custom method and its version."
      - "Add the tier status bar item and the impact tree view, consuming server projections only."
      - "Add a portable-client smoke test (a non-VS-Code LSP client) proving standard methods suffice."

    gate:
      - "cargo test --test custom_method_contract"
      - "npm --prefix /home/sprime01/projects/domainforge-vsc-extension test"
      - "cargo test --test portable_client_smoke"

    teeth:
      - attack: "Run the server against a client that ignores all custom methods."
        expected: "A correct standard LSP experience; no capability silently requires an extension."
      - attack: "Pair an old extension with a new server advertising a higher contract version."
        expected: "Detected and reported — not silently mispaired."
      - attack: "Have the extension parse a .sea file itself."
        expected: "Rejected per REQ-VSC-002."
      - attack: "Remove sea/astJson without a coordinated client release."
        expected: "The extension test fails, proving the coupling is detected rather than discovered by users."

    redesign_trigger: >-
      If version negotiation cannot be added without breaking existing installs,
      ship the negotiation first as advisory-only, then enforce in a later
      release.

    evidence: ".agent/evidence/T18/"

    done_when:
      - "All custom methods namespaced and versioned."
      - "Version mismatch is detected rather than silently tolerated."
      - "A non-VS-Code client gets a correct experience."
      - "The client contract is documented and the client re-derives no semantics."

    creates_affordance: >-
      The server can evolve without silently breaking clients — closing the
      drift class that caused the original outage at the client boundary too.

