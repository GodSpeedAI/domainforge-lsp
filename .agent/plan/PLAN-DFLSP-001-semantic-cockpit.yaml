      - attack: "Offer to auto-substitute a deprecated term."
        expected: "Not offered. Informational only."
      - attack: "Offer a 'fix' for an invalid pack signature."
        expected: "Not offered. Inspection only."
      - attack: "Offer an action, invalidate its gate, then execute."
        expected: "Refused at execution time."
      - attack: "Represent a gate as a confidence score and sort by it."
