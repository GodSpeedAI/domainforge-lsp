  T15:
    title: "Project evaluation state while preserving CEP distinctions"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T14"]
    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "REQ-EVAL-001"
      - "REQ-EVAL-002"
      - "REQ-EVAL-003"
      - "REQ-EVAL-004"

    changes: >-
      Adds L7: projects question/threshold/claim/evidence/settlement/residual/
      diagnostic records into editor-legible states with qualifications intact.

    proves: >-
      The editor can show evaluation state without becoming an evaluation
      authority, and without collapsing claim into evidence, evidence into
      settlement, or absence into failure.

    does_not_prove: >-
      That any evaluation is correct — that authority belongs entirely to sxr.

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T15.prereg.yaml"
      claim: >-
        For every projected record kind, the rendering preserves the
        authority_class qualification stated in record_kinds.csv, and absence of
        evidence renders as unknown rather than as pass or fail.
      falsifier: >-
        Any rendering where a claim reads as evidence, a settlement reads as
        approval, a residual reads as a defect with a suggested fix, or a
        missing record reads as a negative result.
      known_confounds:
        - "The natural UI temptation is a green/red badge, which collapses unknown into one of the two. Three-state rendering is mandatory."
        - "residual.computed is 'derived; never causal authority' — a quick-fix from a residual asserts causation the record disclaims."
        - "claim.made is 'asserted, not evidenced' — never counted as evidence."
      confirmation_condition: >-
        Adversarial review of every rendering against the authority_class
        column, record by record.

    hot_context:
      - "OBSERVED CRITICAL: the cep repository exposes NO per-declaration evaluation API. Its CLI operates on benchmark case directories only. The LSP MUST NOT call it (REQ-EVAL-002)."
      - "OBSERVED: the runtime evaluation surface is sxr — question.declared, threshold.declared, claim.made, evidence.created, settlement.registered, residual.computed, diagnostic.hypothesis, diagnostic.settled."
      - "OBSERVED authority_class strings to preserve verbatim: claim.made='asserted, not evidenced'; settlement.registered='runtime settlement; not approval'; residual.computed='derived; never causal authority'; diagnostic.hypothesis='hypothesis, not verdict'; proposal.raised='no approval/promotion by itself'; observation.recorded='yes only after qualification'."
      - "OBSERVED: verification.contract_imported binds DomainForge Questions/obligations/evidence requirements to declarations — the declared->evaluation bridge and the source for AFF-EVIDENCE-ABSENT."
      - "SPEC CLAIM-007: CanonicalEnvelope and CepEventEnvelope are different things with different names."

    steps:
      - "Define evaluation projection types, one per record kind, each carrying its qualification."
      - "Implement three-state rendering: settled | unsettled | unknown. A two-state badge is forbidden."
      - "Implement AFF-EVIDENCE-ABSENT detection from verification.contract_imported obligations vs evidence.created."
      - "Publish all evaluation findings as Information/Hint via T08's taxonomy — never Error."
      - "Add a review checklist mapping each projection to its authority_class line."
      - "Write tests/evaluation_projection.rs asserting the anti-collapse properties."

    gate:
      - "cargo test --test evaluation_projection"
      - "cargo test --test diagnostic_taxonomy"

    teeth:
      - attack: "Render a declaration with claim.made but no evidence.created as 'verified'."
        expected: "Test fails; must read as claimed-not-evidenced."
      - attack: "Render a declaration with no records as 'failing'."
        expected: "Test fails; must read as unknown / no evidence recorded."
      - attack: "Render settlement.registered as 'approved'."
        expected: "Test fails."
      - attack: "Offer a quick-fix derived from residual.computed."
        expected: "Not offered; rejected as asserting causation the record disclaims."
      - attack: "Add a call to the `cep` CLI."
        expected: "Rejected per REQ-EVAL-002; no such API exists."

    redesign_trigger: >-
      If preserving every qualification makes the projection unreadable, reduce
      what is shown — never reduce the distinctions.

    evidence: ".agent/evidence/T15/"

    done_when:
      - "Every projected record preserves its authority_class qualification."
      - "Three-state rendering enforced; absence never reads as a result."
      - "No call to the cep package exists."
      - "All evaluation diagnostics are Information or Hint."

    creates_affordance: >-
      The user can see whether expectation and observation agree, and on what
      basis — the precondition for offering an honest next move in T16.

  # ---------------------------------------------------------------------------
  T16:
    title: "Expose governed cross-tier affordances"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T11", "T15"]
    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "REQ-EVAL-005"

    changes: >-
      Implements the T3 catalogue entries — AFF-IDENTITY-DRIFT,
      AFF-EVIDENCE-PRESENT, AFF-EVIDENCE-ABSENT, AFF-RESIDUAL,
      AFF-INTEGRATION-UNAVAILABLE — with their specified gates.

    proves: >-
      Observation- and evaluation-derived actions are offered only when their
      tier is available and their gate is satisfied, and none manufactures
      authority the LSP does not have.

    does_not_prove: >-
      That any of these actions settles anything — most are inspection-only by
      design.

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T16.prereg.yaml"
      claim: >-
        Every T3 affordance is unavailable when the observation tier is absent,
        gated correctly when present, and none writes to the ledger, creates a
        snapshot, rebuilds a projection, or runs a verification.
      falsifier: >-
        Any T3 action appearing while the tier is disabled, or any action
        performing a write.
      known_confounds:
        - "AFF-RESIDUAL is the most tempting to over-implement as a quick-fix; the record disclaims causal authority."
        - "AFF-IDENTITY-DRIFT invites 'create a new snapshot', a governed sxr act the LSP has no authority to perform."
        - "AFF-EVIDENCE-ABSENT invites 'run the verification', deferred by OQ-6."
        - "A stale projection invites 'rebuild it for me' — that is a write, and T13 deliberately kept rebuild separate."
      confirmation_condition: >-
        Review with the observation tier both disabled and enabled, confirming
        availability and the absence of any write path.

    hot_context:
      - "SPEC affordance_catalogue T3 entries and gates — AFF-EVIDENCE-ABSENT is requires_evidence; AFF-IDENTITY-DRIFT settles to 'revalidation questions only'."
      - "OQ-6 RESOLVED_DEFERRED: no authority designated for running a verification from the editor. 'Run the verification' and 'create a snapshot' MUST be classified unavailable/future (REQ-AFF-006) and MUST NOT appear as code actions."
      - "OBSERVED: record_kinds.csv semantic.identity_drift settlement_dependency = 'revalidation questions only'. The LSP surfaces the need; it does not act."
      - "T13 kept projection rebuild as a separate explicit command. Offering it here would be governed execution at minimum; prefer not offering it at all in this task."

    steps:
      - "Implement the five T3 catalogue entries as inspection affordances with their gates."
      - "Ensure every one is unavailable when the observation tier is not available."
      - "Classify 'run the verification', 'create a snapshot', and 'rebuild projections' as unavailable/future; do NOT implement them."
      - "Write tests/governed_affordances.rs covering tier-absent and gate-unsatisfied cases."

    gate:
      - "cargo test --test governed_affordances"
      - "cargo test --test affordance_gates"
      - "cargo test --test passive_side_effect_freedom"

    teeth:
      - attack: "Disable the observation tier and list code actions on a declaration with drift."
        expected: "No T3 action offered; tier-unavailable reason shown instead."
      - attack: "Offer 'create snapshot' from AFF-IDENTITY-DRIFT."
        expected: "Not offered — the LSP has no such authority."
      - attack: "Offer 'run verification' from AFF-EVIDENCE-ABSENT."
        expected: "Not offered — deferred by OQ-6, classified unavailable."
      - attack: "Offer a code fix from AFF-RESIDUAL."
        expected: "Not offered."
      - attack: "Offer 'rebuild projections' when T13 reports stale."
        expected: "Not offered in this task; staleness is disclosed, not fixed."
      - attack: "Execute every T3 action with the write tripwire armed."
        expected: "Zero ledger writes, zero projection rebuilds, zero file writes."

    redesign_trigger: >-
      If a T3 affordance cannot be made useful without acting, it does not
      belong in the LSP and should be a link into sxr's own governed surface.

    evidence: ".agent/evidence/T16/"

    done_when:
      - "All five T3 entries behave per their specified gates."
      - "No action creates a snapshot, writes the ledger, rebuilds a projection, or runs a verification."
      - "Tier-absent behavior proven."

    creates_affordance: >-
      The full chain — declared meaning to observed reality to evaluation to a
      governed next move — is traversable at the cursor, with authority
      boundaries intact.

