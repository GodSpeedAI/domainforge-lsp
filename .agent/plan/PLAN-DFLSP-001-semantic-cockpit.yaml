# =============================================================================
# PLAN-DFLSP-001 — DomainForge LSP Modernization: Cross-Repo Dependency-Ordered Build
# =============================================================================
# Conforms to .agent/plans/AGENT_PLAN_TEMPLATE.yaml (schema agent.development_plan 1.0).
#
# REVISION 0.2.0 (2026-09-03) — restructured after maintainer decisions:
#   1. Single maintainer owns domainforge, sxr, domainforge-lsp and the VS Code
#      extension. Enabling upstream changes are now FIRST-CLASS TASKS in this
#      plan (T02 = DF-C1a, T04 = DF-C3, T13 = SXR-C1), not external blockers.
#   2. sxr's ensure_committed + projections::rebuild is a DELIBERATE invariant
#      (F-19b). SXR-C1 therefore delivers a typed-freshness read path, not a
#      rebuild-skipping one.
#   3. OQ-6 (verification authority) deferred past T15 by decision.
#   Tasks renumbered from revision 0.1.0; every task now declares `repo`.
#
# ORDERING PRINCIPLE (CognitiveOS)
#   Each completed task creates the affordance the next task requires.
#   No task is scheduled before its enabling capability exists.
#   Every task records, in `creates_affordance`, what it makes newly possible.
#
# COMMON OWNERSHIP DISCIPLINE
#   One maintainer owning every repo removes coordination cost. It does NOT
#   remove the architectural boundaries: DomainForge remains authoritative for
#   meaning, sxr for observation, CEP for the distinctions, the LSP for
#   projection. Shared ownership makes accidental coupling EASIER, not safer.
#   Cross-repo tasks therefore keep their invariance and equality tests.
# =============================================================================

