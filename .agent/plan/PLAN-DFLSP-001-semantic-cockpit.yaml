  semantic answer derives from DomainForge's canonical envelope, whose
  declaration identity is byte-identical to RealityTrace's, whose diagnostics
  preserve the representation/observation/evaluation distinction, whose
  external integrations are read-only with typed freshness and are
  independently removable, and whose offered actions are gated — proven by
  parity, determinism, identity, hash-invariance, degraded-mode,
  side-effect-freedom, and gate-enforcement gates.

# -----------------------------------------------------------------------------
# OPERATING CONTRACT
# -----------------------------------------------------------------------------
operating_contract:
  core_principle: >-
    Do not implement a capability whose enabling contract is unmet. Because the
    enabling contracts are now tasks in this plan rather than external asks,
    "unmet" means "its task has not settled" — and the correct response is still
    to stop, not to re-derive the upstream behavior locally. That workaround is
    the exact defect this plan exists to remove.

  rules:
    - "No task may add a .sea grammar, a regex over .sea syntax, or a local semantic hash computation to the LSP. The anti-duplication gate from T00 enforces this for the rest of the plan."
    - "No task may make a passive LSP request perform a write, spawn, or network call."
    - "No task may introduce a source position into a cache key, action payload, or external query."
    - "Cross-repo tasks (T02, T04, T13) MUST NOT weaken an upstream invariant to make the LSP's job easier. Where an invariant is inconvenient, expose it as typed state rather than removing it — this is precisely what T13 does with F-19b."
    - "Observation and evaluation work (T14+) is BLOCKED behind identity (T05). Building it earlier would produce a join that appears to work and is nominal only."
    - "When a measurement contradicts an assumption (notably OQ-4 latency in T06), stop and re-plan rather than absorbing the cost silently."
    - "A capability marked not_semantically_meaningful in the spec's matrix MUST NOT be implemented, however cheap it looks."

  claim_states:
    settled: "Gate green, teeth behave as specified, global gates green, evidence recorded."
    partial: "Implemented but a required proof (notably real-integration) has not run."
    blocked: "A prior task in the sequence is unsettled."
    open: "Not started."

  correction_protocol: >-
    If a task's teeth pass for the wrong reason, or its redesign_trigger fires,
    the task returns to open and the plan is amended before further work. A
    failed confirmation is corrected and re-confirmed, never annotated away.

  scope_control: >-
    This plan spans four repositories under one maintainer. Each task names its
    repo. A task MUST NOT make changes outside its declared repo; cross-repo
    coupling happens through the tested contracts (envelope, DeclKey encoding,
    sxr query response), never through incidental shared assumptions.

artifacts:
  current_status: ".agent/current-status.yaml"
  decision_log: ".agent/decisions.md"
  evidence_root: ".agent/evidence/"
  reports_root: ".agent/reports/"
  preregistration_root: ".agent/prereg/"
  status_rule: >-
    Task status lives in current-status.yaml, not in this file. This file is the
    contract; it changes only when the plan itself changes.

# -----------------------------------------------------------------------------
# VERIFICATION
# -----------------------------------------------------------------------------
verification:
  global_gates:
    - id: GATE_BUILD
      command: "cargo build --all-targets"
    - id: GATE_TEST
      command: "cargo test --all-targets"
    - id: GATE_LINT
      command: "cargo clippy --all-targets -- -D warnings"
    - id: GATE_NODUP
      command: "bash scripts/gate-no-duplication.sh"
    - id: GATE_PARITY
      command: "cargo test --test canonical_parity"
    - id: GATE_SIDEEFFECT
      command: "cargo test --test passive_side_effect_freedom"
    - id: GATE_UPSTREAM
      command: "cargo test --test declkey_encoding_equality"

  gate_binding_rule: >-
    T00 binds these aliases to real commands and creates
    scripts/gate-no-duplication.sh. Later tasks reuse them; no task may
    duplicate test logic or introduce a competing command surface. GATE_PARITY
    applies from T03, GATE_UPSTREAM from T04, GATE_SIDEEFFECT from T12, and each
    is required for every task thereafter. Cross-repo tasks run their own repo's
    gates in addition.

  proof_levels:
    P0: "Mechanical/deterministic. Narrow direct gate plus applicable global gates."
    P1: "Normal behavioral work. Positive behavior, a meaningful falsification check, applicable global gates."
    P2: "Invariant-sensitive. Explicit or preregistered claim, adversarial/negative evidence, evidence artifact, global gates, review of a plausible alternate failure path."
    P3: "Settlement-critical. Frozen preregistration, builder evidence, explicit adversarial attacks, fresh independent confirmation, correction and re-confirmation after any failed confirmation."

  preregistration_policy: >-
    All P3 tasks (T03, T04, T05, T11, T13, T14, T15, T16, T19) carry frozen
    preregistrations. The P2 tasks that do not (T00, T01, T02, T06, T07, T08,
    T10, T12, T17, T18) omit it deliberately: each has a mechanical falsifier
    that makes false closure cheap to detect — a build gate, an audit artifact,
    a consistency test, or a tripwire — so a frozen claim would add ceremony
    without adding discrimination. T06 is the exception to watch: if its latency
    measurement becomes the basis for leaving DF-C4 on the roadmap rather than
    promoting it to required, that decision MUST be preregistered before the
    measurement is taken, because the temptation to rationalize a marginal
    number is real.

  independent_confirmation_note: >-
    "Independent" confirmation on a single-maintainer project cannot mean a
    different person. It MUST therefore mean: a fresh target the builder did not
    construct, a preregistration frozen before implementation, and a
    confirmation pass run against the frozen claim rather than against the
    implementation's own assumptions. Where a second reviewer is genuinely
    unavailable, a time-separated adversarial pass against the frozen
    preregistration is the substitute — and the substitution MUST be recorded in
    the evidence, not silently assumed equivalent.

