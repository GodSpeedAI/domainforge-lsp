  T17:
    title: "Security hardening and MCP surface correction"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T11"]
    proof_level: P2
    confirmation: peer

    settles:
      - "REQ-SEC-004"
      - "REQ-SEC-005"
      - "REQ-SEC-006"

    changes: >-
      Extends workspace-root path confinement from the MCP bridge to the server;
      validates configured binary paths; withdraws the MCP rename-preview tool;
      aligns the MCP tool list with declared LSP capabilities.

    proves: >-
      The editor surface cannot read or execute outside declared workspace
      roots, and no tool is advertised whose capability does not exist.

    does_not_prove: >-
      Freedom from vulnerabilities generally; this addresses the observed
      boundary defects.

    hot_context:
      - "OBSERVED DEFECT: src/mcp/tools.rs advertises `domainforge/rename-preview`, but capabilities.rs declares NO rename_provider (FM-MCP-OVERREACH)."
      - "OBSERVED: src/mcp/guardrails.rs has allowed_roots canonicalization (check_path) and per-tool rate limiting (check_rate_limit) — extend, do not duplicate."
      - "OBSERVED: the extension exposes domainforge.mcp.serverPath and rate-limit settings — a workspace-controlled binary path (REQ-SEC-006)."
      - "SPEC: rename remains unimplemented pending the ConceptChange flow; withdrawal is correct, not a regression."

    steps:
      - "Lift allowed-roots confinement into the server for every file-touching path."
      - "Validate configured binary paths before execution; require confirmation for a path sourced from workspace-controlled configuration."
      - "Remove `domainforge/rename-preview` from the MCP tool list."
      - "Add a test asserting every advertised MCP tool maps to a declared LSP capability."
      - "Re-run the side-effect tripwire across the MCP bridge as well as the server."

    gate:
      - "cargo test --test security_boundaries"
      - "cargo test --test mcp_capability_alignment"
      - "cargo test --test passive_side_effect_freedom"

    teeth:
      - attack: "Request a file outside the workspace root via the server and via MCP."
        expected: "Denied on both paths."
      - attack: "Set the sxr binary path to a script in the workspace and trigger enrichment."
        expected: "Refused without explicit confirmation."
      - attack: "Advertise an MCP tool with no corresponding LSP capability."
        expected: "mcp_capability_alignment fails."

    redesign_trigger: >-
      If workspace-relative configuration cannot be validated without breaking
      legitimate setups, the binary path moves to user-level configuration only.

    evidence: ".agent/evidence/T17/"

    done_when:
      - "Path confinement holds on both server and MCP paths."
      - "No MCP tool lacks a declared capability."
      - "Workspace-sourced binary paths require confirmation."

    creates_affordance: >-
      The affordance surface can be exposed to agents and clients without the
      editor becoming an unauthorized execution channel.

