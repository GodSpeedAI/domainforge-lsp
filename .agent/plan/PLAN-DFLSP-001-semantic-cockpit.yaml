        with an unsatisfied gate, or any passive side effect.
      known_confounds:
        - "Builder-prepared fixtures encode builder assumptions; the target must be prepared separately and ideally earlier, before the implementation shaped expectations."
        - "Green tests are not the claim; the claim is about the distinctions, which requires human review of renderings."
        - "Single-maintainer confirmation is not independent by personnel. Use a frozen preregistration and a time-separated adversarial pass, and RECORD that substitution (see verification.independent_confirmation_note)."
      confirmation_condition: >-
        Adversarial review against the spec's conformance_traceability high-risk
        groups, on a fresh target, against the frozen preregistration.

    hot_context:
      - "SPEC conformance_traceability — five high-risk groups: semantic identity, canonical non-duplication, epistemic typing and anti-collapse, passive side-effect freedom, affordance gating."
      - "SPEC implementation_definition_of_done — the twelve conditions."
      - "Adversarial review list: semantic duplication, stale assumptions, invented architecture, feature bloat, LSP features with no consequential use, hidden version coupling, RealityTrace/CEP logic leaking into the LSP, VS Code design in the portable server, passive side effects, missing degraded mode, identity instability, ungated actions, mis-sequenced tasks."

    steps:
      - "Prepare a fresh workspace and sxr ledger independently of the implementation."
      - "Traverse the full chain at several cursors; record each step with evidence."
      - "Re-run every global gate and every task gate across all four repos."
      - "Adversarially review each high-risk group against the frozen preregistration."
      - "Verify every spec claim's level matches its actual evidence; demote any that do not."
      - "Produce .agent/reports/T19-conformance.md listing settled, partial, and open requirements honestly."

    gate:
      - "cargo build --all-targets"
      - "cargo test --all-targets"
      - "cargo clippy --all-targets -- -D warnings"
      - "bash scripts/gate-no-duplication.sh"
      - "cargo test --test canonical_parity"
      - "cargo test --test passive_side_effect_freedom"
      - "cargo test --test observation_real -- --include-ignored"
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core --all-targets"
      - "cd /home/sprime01/projects/sxr && cargo test --all-targets"

    teeth:
      - attack: "On the fresh target, disable every optional integration and traverse the chain."
        expected: "T0-T2 fully functional; every absent tier reports a typed reason."
      - attack: "Present a reviewer with a rendering where evidence is absent and ask what it means."
        expected: "They answer 'we don't know', not 'it failed' or 'it passed'."
      - attack: "Rename a concept on the fresh target and inspect trace continuity."
        expected: "Identity change surfaced; continuity not falsely asserted."
      - attack: "Claim settlement while observation_real is skipped."
        expected: "Blocked — skipped required integration tests are reported skipped, not passed."
      - attack: "Check whether any cross-repo test was weakened to make both sides agree."
        expected: "None. The byte-equality and hash-invariance tests are unchanged from T04."

    redesign_trigger: >-
      Any high-risk group failing confirmation returns its originating task to
      open. It is corrected and re-confirmed, never annotated as an acceptable
      deviation.

    evidence: ".agent/evidence/T19/"

    done_when:
      - "All global and task gates green on a fresh target across all four repos."
      - "All five high-risk groups pass adversarial confirmation."
      - "Claim levels in the spec match actual evidence."
      - "The conformance report distinguishes settled, partial, and open without inflation."
      - "The independent-confirmation substitution is recorded, not assumed equivalent."

    creates_affordance: >-
      The defensible statement becomes true: the DomainForge LSP is the
      interactive semantic projection through which an observer can inspect
      declared meaning, relate it to observed reality and evaluation evidence,
      and discover the next governed action — without collapsing representation,
      observation, evaluation, or authority into one system.

# -----------------------------------------------------------------------------
# FINAL ACCEPTANCE
# -----------------------------------------------------------------------------
final_acceptance:
  conditions:
    - "T00-T19 settled, or explicitly reported blocked with the blocking task named."
    - "All global gates green in every repo touched."
    - "The five high-risk requirement groups confirmed against frozen preregistrations."
    - "Real-integration tests run, not skipped, for every observation and evaluation claim."
    - "No requirement claimed settled on mock evidence alone where real integration is required."
    - "No cross-repo test weakened to resolve a disagreement between repos."

  evidence_and_confirmation:
    - "Evidence under .agent/evidence/<task>/ for every task."
    - "Preregistrations frozen before implementation for T03, T04, T05, T11, T13, T14, T15, T16, T19."
    - "The T19 conformance report is the settlement artifact."

guardrails:
  - "Never restore a bare path dependency as primary. domainforge-core is published; use the version."
  - "Never implement a capability the spec's matrix classifies not_semantically_meaningful."
  - "Never let an observation or evaluation finding become an Error-severity diagnostic."
  - "Never let an unavailable integration render as an empty result."
  - "Never present a gated action as available."
  - "Never write to the RealityTrace ledger, and never call `sxr query evidence` — it rebuilds projections."
  - "Never call the cep package; it has no per-declaration API."
  - "Never use a source position as a durable identity."
  - "Never put spans inside the hashed envelope payload."
  - "Never weaken an upstream invariant to simplify the LSP. Expose it as typed state instead."
  - "Never claim settlement on mocks where real integration is required."

handoff_contract:
  must_report:
    - "Which tasks are settled, partial, blocked, or open — and in which repo."
    - "Which open questions (OQ-1..OQ-8) are resolved and how."
    - "Any claim whose level was demoted, and why."
    - "The measured envelope resolution latency and whether DF-C4 was promoted."
    - "Whether any independent confirmation was substituted, and with what."
  settled_next_action_rule: >-
    On settling a task, report the next ready task, its repo, and the affordance
    the completed task created for it.

