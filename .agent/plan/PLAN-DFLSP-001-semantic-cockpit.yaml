  T05:
    title: "Implement the DeclarationKey identity spine and span binding service"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T04"]
    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "REQ-ID-001"
      - "REQ-ID-002"
      - "REQ-ID-003"
      - "REQ-ID-004"
      - "REQ-ID-005"
      - "REQ-ID-006"

    changes: >-
      Adds L3 Span Binding Service and the DeclarationKey newtype; makes
      DeclarationKey the key of every semantic cache and every external query;
      removes position from all such keys.

    proves: >-
      Identity is stable under meaning-preserving edits, sensitive to
      meaning-changing edits, and joins to RealityTrace byte-for-byte.

    does_not_prove: >-
      That any RealityTrace record exists for these keys (T14).

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T05.prereg.yaml"
      claim: >-
        DeclarationKey is invariant under formatting, comment edits, and file
        moves preserving logical_module_id; changes under rename and
        renamespacing; and round-trips position->key->position within one
        envelope version.
      falsifier: >-
        Any key change under a whitespace-only edit, or any key stability across
        a rename (which would falsely assert continuity across a real identity
        change).
      known_confounds:
        - "ConceptId is UUIDv5 over namespace::name — INHERENTLY unstable across rename. That is correct, and the test must assert the change rather than the stability."
        - "Occurrence keys carry content_hash and duplicate_index; editing one of two identical declarations may reorder duplicate_index. Characterize, do not assume."
        - "File moves that change logical_module_id legitimately change module-scoped identity."
      confirmation_condition: >-
        Identity stability and sensitivity suites both pass, and Occurrence
        duplicate_index behavior is characterized in writing.

    hot_context:
      - "SPEC IdentityFacet — the nine distinct facets that must NOT collapse into one 'version' field."
      - "OBSERVED: concept_id.rs ConceptId::from_concept = UUIDv5(namespace::name) under fixed namespace 6ba7b810-9dad-11d1-80b4-00c04fd430c8, with existing determinism tests."
      - "OBSERVED: src/line_index.rs (50 LOC) is the legitimate UTF-16<->byte mapping and stays."
      - ".agent/reports/T01-duplication-audit.md category (c) — the stubs this task fills."

    steps:
      - "Define DeclarationKey as a newtype over the canonical string; forbid construction from anything but the envelope/sidecar."
      - "Implement SpanBinding: DeclarationKey <-> (logical_module_id, SourceRange), plus reference-site ranges."
      - "Replace every position-keyed cache and lookup with DeclarationKey."
      - "When the sidecar is absent, return a typed degraded state — never fall back to name matching (REQ-ID-007)."
      - "Write tests/identity_stability.rs (format, comment, move) and tests/identity_sensitivity.rs (rename, renamespace)."
      - "Characterize Occurrence duplicate_index behavior in .agent/reports/T05-occurrence-identity.md."
      - "Add a lint or review gate rejecting Position/Range in cache keys and external query payloads."

    gate:
      - "cargo test --test identity_stability"
      - "cargo test --test identity_sensitivity"
      - "cargo test --test declkey_encoding_equality"

    teeth:
      - attack: "Reformat the entire fixture workspace."
        expected: "Zero DeclarationKey changes, zero closure hash change."
      - attack: "Rename a concept and assert the key is STABLE."
        expected: "The assertion fails — proving the suite detects false continuity, the dangerous direction."
      - attack: "Delete the span sidecar and request go-to-definition."
        expected: "Typed degraded state; NO name-matching fallback result."
      - attack: "Use a Position as a HashMap key anywhere in src/."
        expected: "Rejected by the lint/review gate."

    redesign_trigger: >-
      If Occurrence duplicate_index proves unstable across ordinary edits, the
      Occurrence variant cannot carry durable identity, and every affordance
      keyed on non-Concept declarations must be re-scoped. Report rather than
      patch.

    evidence: ".agent/evidence/T05/"

    done_when:
      - "Both identity suites pass with the teeth behaving as specified."
      - "No position appears in any cache key or external query payload."
      - "Occurrence behavior is characterized in writing."
      - "The absent-sidecar path is typed-degraded, with no fallback."

    creates_affordance: >-
      Every fact the LSP knows can be addressed by a durable identity meaningful
      to DomainForge, packs, and RealityTrace alike. T07 can build a facade over
      it; T14 can join to real records.

