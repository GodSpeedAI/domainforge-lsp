tasks:

  # ---------------------------------------------------------------------------
  T00:
    title: "Restore the LSP build on the published domainforge-core crate"
    repo: domainforge-lsp
    initial_status: ready
    depends_on: []
    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "REQ-CANON-001"
      - "REQ-CANON-006"
      - "REQ-COMPAT-001"
      - "REQ-COMPAT-005"

    changes: >-
      Cargo.toml from the deleted `../domainforge/sea-core` path to the
      PUBLISHED `domainforge-core = "0.16"`; all `sea_core::` imports;
      Cargo.lock; a new upstream-compat CI job; a new anti-duplication gate.

    proves: >-
      The repository compiles and tests against domainforge-core 0.16.x from
      crates.io, and a future upstream rename or breaking change fails CI loudly
      rather than silently rotting for months.

    does_not_prove: >-
      That the LSP's behavior is correct, that no semantic logic is duplicated
      (T01), or that any capability works cross-file.

    hot_context:
      - "OBSERVED FACT, do not re-derive: `cargo check --offline` fails with 'failed to read /home/sprime01/projects/domainforge/sea-core/Cargo.toml: No such file or directory'."
      - "OBSERVED FACT: domainforge renamed sea-core -> domainforge-core in commit 9d9e209 (2026-06-20). LSP Cargo.lock still pins sea-core 0.10.0; current is 0.16.0."
      - "OBSERVED FACT (OQ-8 RESOLVED): domainforge-core IS published to crates.io — .github/workflows/release-crates.yml runs `cargo publish --manifest-path domainforge-core/Cargo.toml`; deploy.yml has a 'Publish domainforge-core to crates.io' job; .release-please-manifest.json tracks domainforge-core 0.16.0. USE THE PUBLISHED CRATE, NOT A PATH — a version cannot be deleted from under you, which is exactly how this outage happened."
      - "Use `[patch.crates-io]` for local co-development against domainforge HEAD; do NOT make the path the primary dependency."
      - "OBSERVED: the API the LSP uses still exists under the new name — sea_core::parse_to_graph -> domainforge_core::parse_to_graph; sea_core::semantic_pack::{PackSet, SemanticDiagnostic, validate_graph_with_pack} -> domainforge_core::semantic_pack::{pack_set::PackSet, diagnostics::SemanticDiagnostic, validator::validate_graph_with_pack}."
      - "src/backend.rs:9-10 — the only two `use sea_core::` sites at file scope."
      - "docs/spec.md — asserts 'core library: sea-core, path domainforge/sea-core'. Now actively misleading; correct it."

    steps:
      - "Repoint Cargo.toml to `domainforge-core = \"0.16\"` from crates.io; regenerate Cargo.lock."
      - "Add a commented `[patch.crates-io]` block documenting local co-development against ../domainforge."
      - "Rename all sea_core:: references to domainforge_core:: and fix module paths where the crate reorganized."
      - "Fix all resulting compile errors. Record every API that MOVED or CHANGED SHAPE in .agent/reports/T00-api-delta.md — this is the 6-version drift inventory and T01/T03 depend on it."
      - "Record the compiled-against domainforge-core version as a build-time constant and return it in the initialize result."
      - "Write scripts/gate-no-duplication.sh: fail if src/ contains a .pest grammar, a regex crate dependency, a regex literal matching .sea keywords, or a local sha256/blake3 call over semantic content."
      - "Add .github/workflows/upstream-compat.yml building domainforge-lsp against domainforge HEAD via [patch.crates-io]."
      - "Correct docs/spec.md's stale sea-core references."

    gate:
      - "cargo build --all-targets"
      - "cargo test --all-targets"
      - "cargo clippy --all-targets -- -D warnings"
      - "bash scripts/gate-no-duplication.sh"

    teeth:
      - attack: "Introduce a `regex` dependency and a regex literal matching `entity\\s+\\w+` in src/."
        expected: "GATE_NODUP fails."
      - attack: "Yank/rename the crate in the patch source, simulating the original rename."
        expected: "upstream-compat.yml fails while the released build stays green — proving the early-warning channel works AND that releases are insulated."
      - attack: "Make the path dependency primary again."
        expected: "Rejected in review; the published-crate constraint is the structural fix."

    redesign_trigger: >-
      If the API delta is large enough that the LSP's modules cannot be
      mechanically repaired — for instance if Graph's shape changed such that
      hover/symbol_resolver.rs must be rewritten rather than adjusted — stop.
      That converts T00 into a rewrite and the plan should pull T01/T03 forward
      rather than repairing code destined for deletion.

    evidence: ".agent/evidence/T00/"

    done_when:
      - "All four gate commands exit 0."
      - "The dependency is the published crate, not a path."
      - "The teeth behave as specified."
      - ".agent/reports/T00-api-delta.md exists and enumerates the drift."
      - "docs/spec.md no longer references sea-core."

    creates_affordance: >-
      The code can be compiled, tested, and inspected, and upstream breakage
      becomes loud instead of silent. Every subsequent task depends on this.

  # ---------------------------------------------------------------------------
  T01:
    title: "Audit and excise semantic logic that duplicates domainforge-core"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P2
    confirmation: peer

    settles:
      - "REQ-CANON-002"
      - "REQ-CANON-003"
      - "REQ-CANON-004"
      - "REQ-CANON-005"

    changes: >-
      Removes locally-implemented symbol resolution, name matching, and
      heuristic parsing from hover/symbol_resolver.rs, navigation.rs, and
      code_actions.rs, replacing each with a call to domainforge-core or a
      marked TODO bound to T03's envelope index.

    proves: >-
      No .sea grammar knowledge, resolution rule, or hashing rule exists in the
      LSP outside domainforge-core calls.

    does_not_prove: >-
      That the replacements are correct — many will be stubs pending T03's
      envelope, which is why this task deliberately precedes it.

    hot_context:
      - "src/hover/symbol_resolver.rs (1,146 LOC) — the primary suspect; likely reimplements what CanonicalResolvedReference provides."
      - "src/navigation.rs (154 LOC) — buffer-local definition/reference resolution."
      - "src/code_actions.rs (967 LOC, 4 string-prefix heuristics) — heuristic condition detection."
      - "OBSERVED: no regex crate is in use today; duplication here is hand-rolled string and offset logic."
      - ".agent/reports/T00-api-delta.md — read before deciding whether a behavior moved upstream."

    steps:
      - "Produce .agent/reports/T01-duplication-audit.md classifying every semantic decision in those three files as: (a) delegates to core, (b) duplicates core, (c) duplicates what the envelope will provide, (d) genuinely LSP-local (offset/UTF-16 mapping)."
      - "Delete category (b) outright, calling core instead."
      - "Replace category (c) with an explicit `EnvelopeNotYetAvailable` path and a TODO referencing T03 — do NOT leave working-but-wrong local logic in place."
      - "Keep category (d); it legitimately belongs here (line_index.rs is the model)."
      - "Record any behavior that will regress until T03 lands, in the audit report."

    gate:
      - "cargo test --all-targets"
      - "bash scripts/gate-no-duplication.sh"
      - "test -f .agent/reports/T01-duplication-audit.md"

    teeth:
      - attack: "Search src/ for any function deciding whether two names refer to the same concept without consulting core or the envelope."
        expected: "No such function survives the audit."
      - attack: "Re-add a local 'find declaration by scanning lines for a keyword' helper."
        expected: "Rejected in review as category (c); must route through the envelope."

    redesign_trigger: >-
      If category (c) is the overwhelming majority of the 2,200 lines, the
      correct move is deletion and reconstruction on the envelope in T03, not
      incremental replacement. Say so and amend the plan.

    evidence: ".agent/evidence/T01/"

    done_when:
      - "The duplication audit exists and classifies every semantic decision."
      - "No category (b) code remains."
      - "GATE_NODUP passes."
      - "Regressions pending T03 are explicitly listed, not hidden."

    creates_affordance: >-
      The envelope can become the single source of resolution in T03 without
      competing against a shadow implementation that would silently win.

  # ---------------------------------------------------------------------------
  T02:
    title: "DF-C1a — expose source-map assembly and registry discovery in domainforge-core"
    repo: domainforge
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P2
    confirmation: builder_with_teeth

    settles: []

    changes: >-
      Makes `source_map_from_filesystem` public in domainforge-core, confirms
      `NamespaceRegistry::discover` is public, and adds an in-memory overlay
      parameter so a caller can substitute unsaved buffer contents for on-disk
      contents.

    proves: >-
      An external caller can construct exactly the same
      (entry_logical_path, source_map) pair the domainforge CLI constructs,
      without reimplementing entry resolution or registry discovery.

    does_not_prove: >-
      Anything about the LSP. This is a pure visibility-and-parameter change
      with no semantic content.

    hot_context:
      - "OBSERVED: module/resolver.rs:399 declares `pub(crate) fn source_map_from_filesystem(...)` — crate-private, so the LSP cannot call it."
      - "OBSERVED (OQ-3 RESOLVED): cli/envelope.rs:23-35 is the reference usage — `NamespaceRegistry::discover(&args.target)`, then `registry.namespace_for(&args.target)` for the default namespace, then `source_map_from_filesystem(&target, &source, registry, default_namespace)` returning `(entry_logical_path, source_map)`."
      - "OBSERVED: EnvelopeArgs is `{ target: PathBuf }` — a single target FILE. The entry is derived per-target, not workspace-global. The LSP will pass the active document as target."
      - "OBSERVED: .sea-registry.toml carries version, default_namespace, and [[namespaces]] { namespace, patterns: [glob] }."
      - "The overlay parameter is what lets the LSP resolve UNSAVED buffers without writing a temp tree. Without it, T03 must round-trip through the filesystem on every keystroke."

    steps:
      - "Change `source_map_from_filesystem` to `pub`; audit its signature for anything that should not be public API."
      - "Confirm NamespaceRegistry::discover and namespace_for are public; make them so if not."
      - "Add an optional in-memory overlay map (logical_path -> contents) consulted in preference to disk."
      - "Add a test proving overlay contents win over on-disk contents and that an empty overlay reproduces current behavior byte-for-byte."
      - "Add a test proving the public path reproduces cli/envelope.rs's (entry_logical_path, source_map) exactly."

    gate:
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core source_map"
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core --all-targets"

    teeth:
      - attack: "Pass an empty overlay and compare against the pre-change behavior."
        expected: "Byte-identical source map — proving the parameter is genuinely additive."
      - attack: "Pass an overlay entry for a file that does not exist on disk."
        expected: "Handled deterministically per the documented rule, not a panic."
      - attack: "Pass an absolute path as target and inspect the emitted logical id."
        expected: "Logical id remains workspace-relative; sxr-df's constraint that the producer embeds it verbatim still holds."

    redesign_trigger: >-
      If source_map_from_filesystem's signature exposes internal types that
      should not be public API, wrap it in a narrow public function rather than
      widening the internal one.

    evidence: ".agent/evidence/T02/"

    done_when:
      - "The LSP can call source-map assembly and registry discovery as public API."
      - "The overlay is proven additive and proven to win over disk."
      - "domainforge's own gates stay green."

    creates_affordance: >-
      T03 can assemble the workspace source map from open buffers using
      DomainForge's own logic, instead of reimplementing entry resolution —
      closing the largest remaining duplication risk before it is created.

  # ---------------------------------------------------------------------------
  T03:
    title: "Adopt the canonical semantic envelope as the workspace semantic index"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T01", "T02"]
    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "REQ-IDX-001"
      - "REQ-IDX-002"
      - "REQ-IDX-003"
      - "REQ-IDX-004"
      - "REQ-IDX-006"
      - "REQ-COMPAT-002"
      - "REQ-EVAL-005"

    changes: >-
      Introduces L2 Envelope Service: builds the workspace SourceMap via T02's
      public API with open buffers as overlay, calls
      resolve_semantic_envelope_with_packs, caches the
      CanonicalSemanticEnvelopeDocument keyed by
      (source_set_hash, semantic_pack_set_hash).

    proves: >-
      The LSP's workspace semantic index IS DomainForge's canonical envelope —
      the same resolution, producing the same semantic_closure_hash as the
      `domainforge envelope` CLI on the same input.

    does_not_prove: >-
      That any cursor position maps to a declaration (T04/T05), that resolution
      is fast enough (T06), or that identity is stable (T05).

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T03.prereg.yaml"
      claim: >-
        For any workspace source map, the LSP's in-process envelope resolution
        produces a semantic_closure_hash identical to that produced by
        `domainforge envelope` over the same sources and pack set.
      falsifier: >-
        Any fixture where the two hashes differ — meaning the LSP is re-deriving
        something, or normalizing inputs differently. The drift defect
        reappearing in a new form.
      known_confounds:
        - "Path normalization: logical_module_id must be workspace-relative. sxr-df warns it must never be absolute because the producer embeds it verbatim."
        - "Open-buffer contents differ from disk; the CLI reads disk. Use T02's overlay for the LSP side and a temp tree for the CLI side."
        - "Pack set ordering and the (pack_id, content_hash) encoding must match `--pack id=hash`."
        - "Line ending normalization (CRLF vs LF) would change source_set_hash."
      confirmation_condition: >-
        Parity holds across a fixture suite including multi-module imports,
        namespace bindings, a non-empty pack set, and a model that resolves with
        diagnostics.

    hot_context:
      - "OBSERVED API: resolve_semantic_envelope_with_packs(entry_logical_path: &str, sources_json: &str, semantic_packs: &[(String,String)]) -> Result<CanonicalSemanticEnvelopeDocument, Vec<ApplicationDiagnostic>>."
      - "OBSERVED: the document carries modules{logical_id, semantic_content_hash, namespace}, import_graph, namespace_bindings, semantic_packs, semantic_declarations, resolved_references{source, field_path, target}, application_contract, semantic_closure_hash, self_hash."
      - "OBSERVED: it calls enforce_source_map_budget — input size is bounded; handle the budget error as a typed condition."
      - "OBSERVED CRITICAL DISCIPLINE (sxr-df/src/adapter.rs header): classify by envelope SHAPE, never by exit code. A validated model with diagnostics and an unconstructable model both look like failure at exit-code level and are entirely different outcomes."
      - "OBSERVED: sxr-core/src/types.rs SemanticContext models this as a closed sum Resolved{...} | ValidationFailed{...}. Mirror it; do not use Option."
      - "OBSERVED constants: ENVELOPE_SCHEMA_VERSION, LANGUAGE_SCHEMA_VERSION, INTERPRETATION_VERSION, CANONICALIZATION_VERSION='domainforge-canonicalization/v1'."
      - "SPEC CLAIM-007: name the DomainForge envelope CanonicalEnvelope and the CEP event envelope CepEventEnvelope. Never one name for both."
      - "Use T02's public source_map_from_filesystem + overlay. Do NOT write your own."

    steps:
      - "Implement SourceMap assembly via T02's API, active document as target, open buffers as overlay."
      - "Implement EnvelopeService with a bounded LRU keyed by (source_set_hash, semantic_pack_set_hash)."
      - "Model the result as a closed sum mirroring sxr's SemanticContext; classify strictly by shape."
      - "On ValidationFailed, retain the last successful envelope marked stale (REQ-IDX-006)."
      - "Verify schema_version/canonicalization_version against the supported set; report typed incompatibility."
      - "Build fixture workspaces: multi-module imports, namespace bindings, pack set, resolve-with-diagnostics, unconstructable model, duplicate-content declarations."
      - "Write tests/canonical_parity.rs comparing in-process resolution to the `domainforge envelope` CLI."
      - "Write tests/determinism.rs: 20 repeats plus randomized file ordering."

    gate:
      - "cargo test --test canonical_parity"
      - "cargo test --test determinism"
      - "cargo test --all-targets"

    teeth:
      - attack: "Feed absolute paths as logical_module_id."
        expected: "Parity FAILS and the conversion rejects it — proving the trap is caught, not silently absorbed."
      - attack: "Reorder the source map entries and the pack list."
        expected: "semantic_closure_hash unchanged."
      - attack: "Feed a model that resolves with diagnostics (CLI exit 1, valid shape)."
        expected: "Classified Resolved, not ValidationFailed. Navigation data present."
      - attack: "Feed a model where D cannot be constructed."
        expected: "Classified ValidationFailed; previous envelope retained and marked stale; T0 syntax features still work."
      - attack: "Hand-write a second local closure-hash implementation and compare."
        expected: "Rejected by GATE_NODUP; the LSP must never compute this hash itself."

    redesign_trigger: >-
      If parity cannot be achieved because the CLI and library paths genuinely
      differ (different defaults, different pack binding), stop. That is a
      domainforge defect to fix in domainforge — not something to absorb with an
      LSP-side adjustment that would institutionalize divergence.

    evidence: ".agent/evidence/T03/"

    done_when:
      - "Parity holds across the whole fixture suite."
      - "Determinism holds across repeats and orderings."
      - "The closed-sum classification is proven by the shape teeth."
      - "A stale envelope is retained across a resolution failure."
      - "All global gates green."

    creates_affordance: >-
      Cross-file truth exists inside the LSP for the first time: the import
      graph, every declaration, and every resolved reference. This is the
      substrate T04, T06, T07, and T10 all consume.

  # ---------------------------------------------------------------------------
  T04:
    title: "DF-C3 — span sidecar and canonical DeclarationKey encoding in domainforge-core"
    repo: domainforge
    initial_status: blocked
    depends_on: ["T03"]
    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "REQ-ID-007"

    changes: >-
      Adds to domainforge-core an optional span sidecar — OUTSIDE the hashed
      envelope payload — mapping each CanonicalDeclarationId to
      (logical_module_id, SourceRange) for its declaration site plus
      reference-site ranges for each CanonicalResolvedReference; and a canonical
      string encoding of CanonicalDeclarationId byte-identical to sxr's
      DeclKey::as_str().

    proves: >-
      A cursor position can be mapped to a canonical declaration identity
      without the LSP re-deriving resolution, AND that identity is
      byte-identical to the one RealityTrace uses — with
      semantic_closure_hash provably unchanged.

    does_not_prove: >-
      That the LSP consumes it correctly (T05), or that the join to real sxr
      records returns anything (T14).

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T04.prereg.yaml"
      claim: >-
        The span sidecar can be produced without altering semantic_closure_hash
        for any fixture, and the emitted DeclarationKey string equals sxr
        DeclKey::as_str() byte for byte for all three variants.
      falsifier: >-
        Any change in semantic_closure_hash for identical sources after the
        sidecar is added, or any byte difference in the key encoding.
      known_confounds:
        - "Placing spans inside the hashed envelope WOULD change the closure hash and break every existing sxr snapshot. The sidecar MUST be outside the hashed payload. This is the whole reason the task is P3."
        - "duplicate_index is u32 in domainforge and u64 in sxr — widening is safe, but the string rendering must match."
        - "ConceptId Display is a bare UUID; sxr prefixes 'concept:'. The prefix is added at the encoding boundary, not assumed."
        - "Single-maintainer ownership makes it EASY to 'just change both sides' when they disagree. The byte-equality test must be the arbiter, not convenience."
      confirmation_condition: >-
        A cross-repo test asserting byte equality for all three DeclKey
        variants, plus an unchanged-closure-hash test across the T03 fixture
        suite, both run against a frozen claim.

    hot_context:
      - "OBSERVED: spans ARE available at envelope build time — envelope.rs:684 iterates `module.ast.declarations` as `spanned`, where parser/ast.rs:141 defines Spanned<T>{line, column}. They are deliberately dropped."
      - "OBSERVED: the envelope contains NO span/line/column/SourceRange field."
      - "OBSERVED: ApplicationDiagnostic.context ALREADY carries logical_module_id, line, column, symbol_id, field_path — precedent that position data travels BESIDE, not inside, the canonical payload."
      - "OBSERVED encoding to match, sxr-core/src/types.rs:49 — concept:{id} | application:{sym} | occurrence:{kind}:{content_hash}:{duplicate_index}."
      - "OBSERVED: domainforge-core/src/validation_error.rs already defines Position{line, column} and SourceRange{start, end} — reuse, do not invent."
      - "OQ-1 RESOLVED: sidecar-outside-hash approach accepted by the maintainer. The engineering constraint stands regardless."

    steps:
      - "Implement the sidecar as a structure returned alongside — never inside — CanonicalSemanticEnvelopeDocument."
      - "Populate declaration-site ranges from the Spanned<T> data already in hand at envelope.rs:684."
      - "Populate reference-site ranges for each CanonicalResolvedReference."
      - "Implement Display/as_str on CanonicalDeclarationId with the exact sxr encoding."
      - "Add tests/span_sidecar_hash_invariance.rs upstream: closure hash identical with and without sidecar generation, across the T03 fixtures."
      - "Add tests/declkey_encoding_equality.rs asserting byte equality with sxr DeclKey::as_str() for all three variants."
      - "Document in domainforge that the sidecar is explicitly NOT part of the canonical hashed payload and must never become so."

    gate:
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core span_sidecar_hash_invariance"
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core declkey_encoding_equality"
      - "cd /home/sprime01/projects/domainforge && cargo test -p domainforge-core --all-targets"
      - "cargo test --test canonical_parity"

    teeth:
      - attack: "Move the sidecar inside the hashed envelope payload."
        expected: "span_sidecar_hash_invariance FAILS — demonstrating the placement constraint is real, not stylistic."
      - attack: "Emit `concept:` keys without the prefix, or with uppercase hex."
        expected: "declkey_encoding_equality fails."
      - attack: "Reformat a fixture file (whitespace only) and re-resolve."
        expected: "Spans change; DeclarationKeys and semantic_closure_hash do not."
      - attack: "Change sxr's DeclKey encoding to match a wrong domainforge encoding."
        expected: "Rejected in review — the sxr encoding is the established one with committed ledger data behind it; domainforge conforms to it, not the reverse."

    redesign_trigger: >-
      If spans cannot be produced without touching the hashed payload, the
      identity design is invalidated. Stop and re-plan; do not substitute
      name-based matching, which would produce a join that appears to work and
      silently mismatches on every rename and duplicate.

    evidence: ".agent/evidence/T04/"

    done_when:
      - "The sidecar exists outside the hashed payload."
      - "Closure hash is provably unchanged by its introduction."
      - "Key encoding byte-equality with sxr is proven by test."
      - "The not-part-of-the-hash constraint is documented in domainforge."

    creates_affordance: >-
      Position becomes convertible to identity, and that identity is the same
      one RealityTrace uses. This is the hinge: T05, T09 navigation, and the
      entire T14-T16 observation/evaluation arc are impossible without it.

