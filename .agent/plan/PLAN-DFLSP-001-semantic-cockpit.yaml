  T06:
    title: "Measure resolution cost; implement debouncing, cancellation, bounded caching, progress"
    repo: domainforge-lsp
    initial_status: blocked
    depends_on: ["T03"]
    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "REQ-IDX-005"
      - "REQ-PERF-001"
      - "REQ-PERF-002"
      - "REQ-PERF-003"
      - "REQ-PERF-004"
      - "REQ-PERF-005"
      - "REQ-PERF-006"

    changes: >-
      Adds debounced, cancellable background envelope resolution; incremental
      text sync; bounded caches with declared eviction; workDoneProgress on cold
      start; resolves OQ-4 by measurement.

    proves: >-
      Editing latency is governed by the syntax tier alone, and envelope
      resolution never blocks a keystroke or an initialize.

    does_not_prove: >-
      That resolution is fast enough in general — that is a measurement outcome,
      and if it fails, DF-C4 is promoted from roadmap to a required domainforge
      task.

    hot_context:
      - "OBSERVED: capabilities.rs declares TextDocumentSyncKind::FULL — whole document on every keystroke."
      - "OBSERVED: resolve_semantic_envelope_with_packs takes the WHOLE source map; no incremental entry point, and enforce_source_map_budget implies bounded input."
      - "SPEC CLAIM-010 / OQ-4 — cost is UNMEASURED. Measure before designing around it."
      - "OBSERVED: the LSP already depends on `lru`; reuse it."
      - "PREREGISTER the latency threshold BEFORE measuring (see verification.preregistration_policy)."

    steps:
      - "Preregister the interactive latency budget and the DF-C4 promotion threshold."
      - "Build a representative multi-module benchmark fixture; measure cold-start and per-edit cost; record in .agent/reports/T06-latency.md."
      - "Switch to TextDocumentSyncKind::INCREMENTAL."
      - "Implement debounce + supersede: a newer edit cancels an in-flight resolution and the superseded one publishes nothing."
      - "Implement $/cancelRequest handling."
      - "Bound every cache with a declared eviction policy."
      - "Report cold-start indexing via workDoneProgress; return initialize immediately."
      - "If measured cost exceeds the preregistered budget, STOP and add DF-C4 as a domainforge task before T07."

    gate:
      - "cargo test --test incrementality"
      - "cargo bench --bench envelope_resolution || cargo test --test latency_budget"

    teeth:
      - attack: "Type 50 characters rapidly."
        expected: "Syntax diagnostics keep pace; at most one envelope resolution completes; superseded ones publish nothing."
      - attack: "Cancel a request mid-resolution."
        expected: "Work actually stops; no result published for the cancelled request."
      - attack: "Open a workspace far larger than the fixture."
        expected: "initialize returns promptly; progress reported; memory bounded."

    redesign_trigger: >-
      Measured full-workspace resolution exceeding the preregistered budget.
      That invalidates the assumption behind L2 and makes DF-C4 a prerequisite
      for T07.

    evidence: ".agent/evidence/T06/"

    done_when:
      - "Latency measured and recorded against a preregistered budget; OQ-4 answered."
      - "Incremental sync, debounce, supersede, cancellation proven by the teeth."
      - "All caches bounded."
      - "initialize never blocks on indexing."

    creates_affordance: >-
      The envelope can be consulted on the interactive path without risking the
      editing experience, which is what makes T07's facade safe to call from
      request handlers.

