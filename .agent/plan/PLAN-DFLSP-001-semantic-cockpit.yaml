  T13:
    title: "SXR-C1 — side-effect-free declaration query with typed projection freshness"
    repo: sxr
    initial_status: blocked
    depends_on: ["T12"]
    proof_level: P3
    confirmation: independent_adversarial

    settles: []

    changes: >-
      Adds to sxr-cli a read-only `query declaration --repo <r> --decl <declkey>
      [--since <checkpoint>]` that reads the existing projection store WITHOUT
      rebuilding, returning records alongside a typed freshness state.

    proves: >-
      A caller can inspect declaration-bound records without mutating sxr state,
      and can always tell exactly how far behind the projection store is.

    does_not_prove: >-
      That the LSP consumes it correctly (T14).

    preregistration:
      required: true
      artifact: ".agent/prereg/PLAN-DFLSP-001-T13.prereg.yaml"
      claim: >-
        The new command performs zero writes — no ledger append, no projection
        rebuild, no file mutation — and its freshness state correctly
        distinguishes current, stale{projection_head, ledger_head}, absent, and
        pending{uncommitted_entities}.
      falsifier: >-
        Any write observed during the command, or any case where a stale
        projection is reported as current.
      known_confounds:
        - "MAINTAINER-CONFIRMED: ensure_committed + projections::rebuild in query_evidence is a DELIBERATE invariant (F-19b: 'a queried entity must be committed, not pending'). The new command must PRESERVE that guarantee by exposing staleness, not by skipping the check."
        - "A projection store that has never been built is a different state from one that is merely behind — absent vs stale."
        - "Uncommitted entities are a different state again — pending. Collapsing any of these into 'no records' would reintroduce the exact defect."
        - "Read-only is easy to claim and easy to violate accidentally via a lazily-initializing connection. The tripwire must be at the filesystem/SQLite level, not a code review."
      confirmation_condition: >-
        A filesystem-level write tripwire observes zero mutations across every
        freshness state, and each of the four states is reproduced by a
        constructed fixture.

    hot_context:
      - "OBSERVED: sxr-cli/src/commands.rs:2378 `query_evidence(ctx, repo_id, entity)` calls state::require_enrollment, then durability::ensure_committed(ctx, repo_id, &[entity]), then projections::rebuild(ctx, repo_id), then projections::query_evidence_declared(&conn, repo_id, entity). It WRITES."
      - "OBSERVED: sxr-cli/src/projections.rs:1784 `query_evidence_declared(conn, repo_id, entity)` is the underlying read — this is the function to build on."
      - "OBSERVED: sxr-cli/src/main.rs QueryCmds currently has exactly one variant, Evidence{repo, entity}."
      - "OBSERVED: global --json flag exists; output::print_json is the emitter."
      - "OBSERVED: DeclKey::as_str() (sxr-core/src/types.rs:49) is the key format; subject_refs carry declaration refs per record_kinds.csv."
      - "DO NOT modify or weaken query_evidence. Add a new command alongside it."

    steps:
      - "Add `QueryCmds::Declaration { repo, decl, since }` to sxr-cli."
      - "Implement it over query_evidence_declared (or a declaration-keyed sibling) WITHOUT calling rebuild or ensure_committed as a mutation."
      - "Compute the freshness state by comparing projection head against ledger head, and detect uncommitted entities, WITHOUT committing them."
      - "Return records plus the typed freshness state in the --json payload."
      - "Add a filesystem/SQLite write tripwire test asserting zero mutations."
      - "Add fixtures reproducing each of current / stale / absent / pending."
      - "Document that rebuild remains a separate, explicit, state-changing command."

    gate:
      - "cd /home/sprime01/projects/sxr && cargo test -p sxr-cli query_declaration"
      - "cd /home/sprime01/projects/sxr && cargo test -p sxr-cli read_only_tripwire"
      - "cd /home/sprime01/projects/sxr && cargo test --all-targets"

    teeth:
      - attack: "Run the command with a filesystem write tripwire armed, in every freshness state."
        expected: "Zero writes — including no SQLite journal or WAL mutation."
      - attack: "Query with a stale projection store and check the response."
        expected: "Reports stale with both heads — NOT current, and NOT silently rebuilt."
      - attack: "Query a repo whose projections were never built."
        expected: "Reports absent, distinctly from stale and from no-records."
      - attack: "Query an entity with uncommitted ledger entries."
        expected: "Reports pending — preserving the F-19b guarantee by disclosure rather than by writing."
      - attack: "Make the new command call rebuild 'just to be helpful'."
        expected: "read_only_tripwire fails — this is the whole point of the task."

    redesign_trigger: >-
      If projection head and ledger head cannot be compared without a write, the
      freshness state cannot be computed read-only, and the design must change
      to a cached head marker rather than acquiring a write to answer a read.

    evidence: ".agent/evidence/T13/"

    done_when:
      - "The command exists and is proven read-only by a filesystem tripwire."
      - "All four freshness states are reproduced and correctly reported."
      - "query_evidence is unchanged."
      - "sxr's own gates stay green."

    creates_affordance: >-
      The editor can ask RealityTrace about a declaration without mutating it,
      and can tell the user how current the answer is. T14 becomes possible
      without violating REQ-OBS-001 or REQ-SEC-001.

