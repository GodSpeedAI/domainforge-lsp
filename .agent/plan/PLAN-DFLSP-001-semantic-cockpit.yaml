      - "Implement the T1 catalogue entries with their specified gates."
      - "Add executeCommand with an execution-time gate re-check that refuses on lapse."
      - "Add codeAction/resolve so offer-time stays cheap."
      - "Write tests/affordance_gates.rs with an unsatisfied-gate workspace per catalogue entry."

