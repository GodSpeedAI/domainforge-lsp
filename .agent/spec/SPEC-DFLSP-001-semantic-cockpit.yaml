  - capability: "textDocument/semanticTokens"
    status_now: "absent"
    classification: high_value_now
    semantic_job: "Distinguish declaration kinds and, critically, resolved vs unresolved references — a semantic distinction TextMate grammar cannot make."

  - capability: "textDocument/prepareRename + rename"
    status_now: "absent as LSP capability, but advertised via MCP  [observed: FM-MCP-OVERREACH]"
    classification: requires_upstream_first
    semantic_job: >-
      A rename in .sea changes ConceptId, hence identity, hence every downstream
      binding (CLAIM-004). Offering a plain textual rename would silently break
      trace continuity. Rename MUST be gated behind the ConceptChange affordance.
      Until that is designed, prepareRename SHOULD return an explanation rather
      than a range, and the MCP tool MUST be withdrawn (REQ-SEC-005).

  - capability: "textDocument/completion (+ resolve)"
    status_now: "implemented (206 + 148 LOC)"
    classification: high_value_now
    semantic_job: "Completion from the envelope's declaration set and pack concepts, with status (deprecated/proposed/rejected) surfaced. resolve defers documentation lookup."

  - capability: "textDocument/documentHighlight"
    status_now: "absent"
    classification: useful_later
    semantic_job: "Same-identity occurrences in the current file. Cheap once references exist."

  - capability: "textDocument/foldingRange, selectionRange"
    status_now: "absent"
    classification: useful_later
    semantic_job: "Structural ergonomics from the AST. Low cost, low consequence."

  - capability: "textDocument/documentLink"
    status_now: "absent"
    classification: useful_later
    semantic_job: "Navigate import statements to their modules."

  - capability: "textDocument/typeDefinition"
    status_now: "absent"
    classification: not_semantically_meaningful
    semantic_job: "SEA has no type/value distinction that this maps to. Deliberately omitted."

  - capability: "textDocument/implementation"
    status_now: "absent"
    classification: useful_later
    semantic_job: "Could mean pattern -> instances, or entity -> role bindings. Only worth adding if a single unambiguous meaning is chosen; ambiguous mapping is worse than absence."

  - capability: "textDocument/signatureHelp"
    status_now: "absent"
