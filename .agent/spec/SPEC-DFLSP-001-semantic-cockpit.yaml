  - capability: "dynamic registration"
    status_now: "absent"
    classification: useful_later
    semantic_job: "Register observation-tier capabilities only when that tier is available, so clients do not offer dead UI."

  - capability: "workspace/executeCommand"
    status_now: "absent on server; extension has 5 client-side commands"
