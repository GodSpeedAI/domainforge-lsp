# =============================================================================
# SPEC-DFLSP-001 — DomainForge LSP as Semantic Inspection & Affordance Surface
# =============================================================================
# Conforms to .agent/specs/AGENT_SPEC_TEMPLATE.yaml (schema agent.spec 1.0).
#
# EVIDENCE DISCIPLINE
#   observed  = read in source/tests/command output during this investigation
#   declared  = stated by repository prose (may contradict implementation)
#   inferred  = derived from observed facts, not directly read
#   proposed  = this spec's design choice, not yet in any repository
#   unknown   = not established
# Every non-obvious factual assertion below is tagged.
# =============================================================================

schema: agent.spec
schema_version: "1.0"

metadata:
  id: "SPEC-DFLSP-001"
  title: "DomainForge LSP — Layered Semantic Inspection, Navigation, and Governed Affordance Surface"
  status: "draft"
  version: "0.1.0"
  created: "2026-09-03"
  scope: >-
    Primarily the domainforge-lsp repository: the portable LSP server binary,
    its internal semantic service layers, its adapters to DomainForge
    (domainforge-core), RealityTrace (sxr), and the CEP-implementing settlement
    surface, plus the boundary contract it offers the VS Code client.
    Because domainforge, sxr, domainforge-lsp and domainforge-vsc-extension
    share a single maintainer, the enabling changes in domainforge (DF-C1a,
    DF-C3) and sxr (SXR-C1) are sequenced as first-class tasks in the
    accompanying plan rather than treated as external prerequisites. They
    remain specified here as CONTRACTS, with their authority boundaries intact:
    common ownership changes who schedules the work, not which system is
    authoritative for what.
  purpose: >-
    Convert domainforge-lsp from a currently non-compiling, single-file,
    syntax-oriented language server into the interactive projection through
    which an observer inspects declared meaning, its governance and
    dependencies, its relationship to observed reality and evaluation
    evidence, and the next governed action — without collapsing
    representation, observation, evaluation, and authority into one system.
  owner: "DomainForge tooling"

  normative_language: "RFC 2119"
  normative_keywords:
    MUST: "Conformance depends on it."
    MUST_NOT: "Conformance is destroyed by it."
    SHOULD: "Strongly expected; deviation must be recorded with rationale."
    MAY: "Genuinely optional."

  implementation_defined_meaning: >-
    A choice this spec deliberately leaves to the implementer, constrained by
    a stated outcome. The implementer MUST record the choice; the outcome
    remains normative.

# -----------------------------------------------------------------------------
# 1. SOURCES
# -----------------------------------------------------------------------------
