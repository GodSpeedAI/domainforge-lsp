      `domainforge-core` on 2026-06-20 (commit 9d9e209). Cargo.lock still pins
      `sea-core 0.10.0`; current is `domainforge-core 0.16.0`.
    consequence: >-
      inferred — every capability claim about the current LSP is unverifiable
      by execution. The 2026-08-26 "semantic pack support" commit was made
      against a repository that cannot compile.

# -----------------------------------------------------------------------------
# 2. SPEC FRAME
# -----------------------------------------------------------------------------
spec_frame:
  quality_gate_questions:
    - "What is the canonical source of .sea syntax and semantics for the LSP, and is any of it duplicated?"
    - "What is the stable identity of a declaration across source, pack, trace, and evaluation surfaces?"
    - "Which integrations are fast enough for an editor hot path, and what happens when each is absent?"
    - "How is a semantic error distinguished from evidence of real-world divergence?"
    - "For each surfaced fact, what governed next action does it make affordable, and what gates that action?"
    - "Which upstream (domainforge / sxr) contracts must exist before an LSP capability is safe to build?"

  proof_loop:
    - "Bind to domainforge-core as a versioned library; prove no grammar or semantic rule is reimplemented in the LSP."
    - "Prove position -> DeclarationKey -> position round-trips are stable across formatting, rename, and file moves."
    - "Prove every external integration has a typed-unavailable path exercised by a test with the integration absent."
    - "Prove no passive LSP request (hover, diagnostics, inlay) performs a write, spawn, or network call."
    - "Prove every offered action declares and enforces its gate state before appearing as available."

# -----------------------------------------------------------------------------
# 3. PROBLEM STATEMENT
# -----------------------------------------------------------------------------
problem_statement:
  system_name: "domainforge-lsp"

  problem_summary: >-
    domainforge-lsp is a broken, single-layer syntax server. It does not
    compile against current DomainForge. Its whole model of a workspace is one
    document at a time. Meanwhile DomainForge has grown a complete, resolved,
    position-free, hash-identified semantic envelope with cross-module import
    resolution and reference resolution; RealityTrace has grown a 27-record
    append-only ledger keyed by a declaration key structurally identical to
    DomainForge's; and CEP has fixed the epistemic distinctions both rely on.
    The editor is the one place a human touches all of this, and it currently
    projects none of it.

  job_to_be_done:
    actor: "An engineer or agent editing a .sea model in an LSP-capable editor."
    job: >-
      While reading or changing a declaration, understand what it means, what
      governs it, what depends on it, how it has changed, what reality has been
      observed about it, what evidence exists, whether expectation and
      observation agree, and what governed action is available next — without
      leaving the editor and without being misled about the epistemic status
      of any of it.
    done_when: >-
      The engineer can move from a cursor position to a stable semantic
      identity, and from that identity to governance, dependency, evolution,
      observation, evidence, and evaluation projections, each labelled with its
      source and epistemic status, each exposing a next action whose gates are
      visible and enforced.

  current_failure_modes:
    - id: FM-BUILD
      text: "observed — The server does not build. Its dependency path was deleted upstream 2026-06-20."
    - id: FM-NOWORKSPACE
      text: "observed — backend.rs stores documents in a per-URI map and validates each with parse_to_graph(single source). There is no cross-file resolution, no import graph, no workspace index. Cross-file go-to-definition is structurally impossible."
    - id: FM-DRIFT-DOC
      text: "observed — docs/spec.md (dated 2025-12-15) states the canonical library is `sea-core` at `domainforge/sea-core` and asserts 'Zero logic duplication'. The library no longer exists under that name or path. Documentation and implementation agree with each other and both are wrong about reality."
    - id: FM-UNUSED-SURFACE
      text: "observed — the server registers custom method `textDocument/hoverPlus`; the VS Code extension never calls it (it calls only `sea/astJson`). An implemented surface has no consumer."
    - id: FM-MCP-OVERREACH
      text: "observed — src/mcp/tools.rs advertises `domainforge/rename-preview`, but capabilities.rs does not declare `rename_provider`. A tool is advertised whose underlying LSP capability is not offered."
    - id: FM-IDENTITY-BY-POSITION
      text: "observed — navigation.rs and hover/symbol_resolver.rs resolve by name and source offset within a single buffer. Nothing in the LSP carries a durable semantic identity, so nothing it produces can be joined to a pack, a trace, or an evaluation record."
    - id: FM-NO-EPISTEMIC-TYPING
      text: "observed — diagnostics.rs and semantic_diagnostics.rs map findings onto LSP severities only. DomainForge already models `SemanticTruth {Valid, Invalid, Unknown}` and the LSP discards it, collapsing 'unknown' into 'fine'."

  why_existing_approaches_fail: >-
    Repairing the build alone leaves a per-document server that cannot answer
    any cross-file, governance, evolution, observation, or evaluation question.
    Conversely, adding those answers on top of the present architecture would
    require the LSP to re-derive module resolution, identity, and hashing that
    DomainForge already computes — reproducing exactly the drift that broke it.

  important_boundary:
    representation: "DomainForge — declared semantic meaning. Authoritative for grammar, resolution, identity, hashing, packs, diff, projections."
    observation: "RealityTrace (sxr) — observed consequence, provenance, evidence, settlement. Authoritative for what happened."
    evaluation: "CEP — the protocol fixing the distinctions (question, evidence, threshold, settlement, capability). Its runtime realization for these repos lives in sxr; the cep repo is the specification and conformance-corpus authority."
    projection: "domainforge-lsp — interactive projection and affordance surface over the three. Authoritative for none of them."
    rule: >-
      The LSP MUST NOT be the canonical store of DomainForge semantics, MUST
      NOT re-implement RealityTrace storage/verification/provenance, and MUST
      NOT become an evaluation authority. It MAY cache, index, and project.

# -----------------------------------------------------------------------------
# 4. REQUIREMENTS FRAME
# -----------------------------------------------------------------------------
requirements:
  goals:
    - "Restore a compiling, versioned, single-source-of-truth binding to domainforge-core."
    - "Establish a workspace semantic index derived from DomainForge's canonical semantic envelope, not re-derived."
    - "Establish a stable DeclarationKey identity shared verbatim with RealityTrace, and a position<->identity binding that survives edits that do not change meaning."
    - "Route every LSP projection through one internal semantic query service so no business logic lives in protocol handlers."
    - "Give diagnostics a typed taxonomy that preserves the representation / observation / evaluation distinction and epistemic status."
    - "Expose observation and evaluation as read-only, deferred, typed-optional enrichment that can never block editing."
    - "Model actions as gated affordances with explicit precondition, authority, execution, settlement, and failure semantics."
    - "Keep the server portable; confine VS Code-specific presentation to the client."

  non_goals:
    - "The LSP does not write to the RealityTrace ledger. Read-only. (Emission is sxr's job.)"
    - "The LSP does not score, grade, or compute CEP conformance. It projects settlement records produced elsewhere."
    - "The LSP does not modify the .sea grammar, DomainForge semantics, or RealityTrace record semantics."
    - "The LSP does not create cross-project APIs for its own convenience; each upstream contract in this spec is justified by an affordance that is otherwise impossible."
    - "No LSP capability is implemented for protocol completeness. Capabilities classified `not_semantically_meaningful` in the matrix are deliberately absent."
    - "No AI/LLM inference inside the language server."

# -----------------------------------------------------------------------------
# 5. OUTCOME CONTRACT
# -----------------------------------------------------------------------------
outcome_contract:
  output_produced:
    - "A `domainforge-lsp` binary speaking LSP over stdio, building against domainforge-core >= 0.16 as a versioned library dependency."
    - "An internal SemanticQuery service exposing declaration lookup, dependency, governance, evolution, observation, evaluation, and affordance projections keyed by DeclarationKey."
    - "A typed DiagnosticRecord stream carrying source, code, severity, epistemic status, evidence reference, and actionability."
    - "A typed AffordanceRecord set with explicit gate state."
    - "A documented, versioned server<->client contract for the VS Code extension."

  outcome_verified:
    - "The workspace fixture builds an envelope whose semantic_closure_hash equals the hash produced by `domainforge envelope` on the same sources (proves no divergent re-derivation)."
    - "A DeclarationKey resolved at a cursor equals the DeclKey string that sxr records for the same declaration in the same snapshot (proves the join is real, not nominal)."
    - "With sxr absent and no network, all representation-tier capabilities return correct results and all observation/evaluation surfaces return a typed unavailable state; no request errors and no hang."
    - "Reformatting a fixture (whitespace only) changes no DeclarationKey and no semantic_closure_hash."

  consumer_and_handoff:
    consumers:
      - "domainforge-vsc-extension (primary client)."
      - "Any LSP 3.17 client (neovim, Helix, Zed, Emacs eglot) for the portable capability subset."
      - "The existing MCP bridge binary (`domainforge-mcp`), which drives the server as an LSP client."
    handoff_rule: >-
      Portable capabilities MUST be reachable through standard LSP methods.
      Custom methods MUST be namespaced `domainforge/*`, versioned, and
      advertised in an `initialize` result extension so a client can detect
      them; a client that ignores them MUST still get a correct standard
      experience.

# -----------------------------------------------------------------------------
# 6. CAPABILITY CLAIM
# -----------------------------------------------------------------------------
capability_claim:
  applicability: "applicable"
  owner: "The engineer or agent editing .sea source."
  delta: >-
    Before: the editor can tell you a file parses. After: the editor can tell
    you what a declaration is, what governs it, what depends on it, how its
    meaning has changed, what has been observed about it, what evidence
    exists, whether declared and observed agree, and which of the available
    next actions is actually permitted right now.
  why_in_scope: >-
    The capability is only real if the editor preserves the distinctions the
    three upstream systems maintain. A projection that flattens them creates
    confident wrongness, which is worse than the current absence.
  proven_only_if:
    - "The DeclarationKey join to sxr is demonstrated against real sxr records, not fixtures alone."
    - "An affordance whose gate is unsatisfied is demonstrably NOT offered as available."
    - "Degraded mode is demonstrated with each integration independently removed."
  not_proven_by:
    - "Hover rendering more fields."
    - "A larger LSP capability matrix."
    - "Passing tests that only use mocks at the adapter boundary."
  learning_claim: >-
    We expect to learn whether a position-free canonical envelope plus a span
    sidecar is sufficient to drive an interactive editor at typing latency, or
    whether an incremental resolution API is required upstream.

# -----------------------------------------------------------------------------
# 7. CLAIM DISCIPLINE
# -----------------------------------------------------------------------------
claim_discipline:
  levels:
    evidence_backed: "Supported by implementation, tests, logs, proof commands, or inspectable artifacts."
    partially_proven: "Implemented in meaningful pieces but not proven end-to-end or in the target environment."
    assumption: "Required for the design to hold but not yet proven."
    roadmap: "Intended future behavior, not required for current conformance."

  claims:
    - id: CLAIM-001
      claim: "domainforge-core exposes a complete resolved semantic envelope with cross-module import resolution, reference resolution, and content hashing, sufficient to serve as the LSP's workspace index."
      level: evidence_backed
      required_evidence: "Public API with the needed shape."
      current_evidence: >-
        observed — domainforge-core/src/application/envelope.rs:
        `resolve_semantic_envelope_with_packs(entry_logical_path, sources_json,
        &[(pack_id, content_hash)]) -> Result<CanonicalSemanticEnvelopeDocument,
        Vec<ApplicationDiagnostic>>`. Document carries modules
        (logical_id, semantic_content_hash, namespace), import_graph,
        namespace_bindings, semantic_packs, semantic_declarations,
        resolved_references (source decl, field_path, target),
        application_contract, semantic_closure_hash, self_hash.
        Input is an in-memory source map JSON — no filesystem dependency.
      gap: "None for the envelope itself. See CLAIM-002 for positions."

    - id: CLAIM-002
      claim: "The canonical envelope alone is NOT sufficient for editor use, because it is deliberately position-free."
      level: evidence_backed
      required_evidence: "Absence of span data in the envelope; presence upstream in the AST."
      current_evidence: >-
        observed — envelope.rs contains no span/line/column/SourceRange field on
        any Canonical* type. It is built at envelope.rs:684 by iterating
        `module.ast.declarations` as `spanned`, i.e. `Spanned<T>` (parser/ast.rs:141,
        with `line: usize`, `column: usize`) — the span is in hand at build time
        and deliberately discarded. ApplicationDiagnostic DOES retain
        `context.logical_module_id`, `context.line`, `context.column`,
        `context.symbol_id`, `context.field_path`.
      gap: >-
        The LSP cannot map cursor -> CanonicalDeclarationId without either
        re-deriving resolution (forbidden: that is the drift that broke it) or
        an upstream span sidecar. This is upstream contract DF-C3.

    - id: CLAIM-003
      claim: "DomainForge's declaration identity and RealityTrace's declaration key are the same construct, so the source<->trace join is structural, not nominal."
      level: evidence_backed
      required_evidence: "Both type definitions, compared."
      current_evidence: >-
        observed — domainforge-core application/envelope.rs
        `enum CanonicalDeclarationId { Concept{id: ConceptId},
        Application{id: ApplicationSymbolId},
        Occurrence{kind: String, content_hash: String, duplicate_index: u32} }`.
        observed — sxr-core/src/types.rs:38
        `enum DeclKey { Concept(String), Application(String),
        Occurrence{kind: String, content_hash: String, duplicate_index: u64} }`
        with `as_str()` producing `concept:{id}` / `application:{sym}` /
        `occurrence:{kind}:{content_hash}:{duplicate_index}`, documented at
        types.rs:35 as "Stable declaration key, the spine of the system (§12.1).
        Deterministic, path-independent, reproducible."
      gap: >-
        `duplicate_index` differs in width (u32 vs u64) — harmless widening.
        The canonical STRING form is defined only in sxr. DomainForge does not
        emit the string form. Upstream contract DF-C3 must fix the string
        encoding so both sides agree byte-for-byte.

    - id: CLAIM-004
      claim: "ConceptId is deterministic from (namespace, name) and therefore survives file moves and formatting, but NOT rename or renamespacing."
      level: evidence_backed
      required_evidence: "Implementation and its tests."
      current_evidence: >-
        observed — concept_id.rs: `ConceptId::from_concept(namespace, name)` =
        UUIDv5 over `"{namespace}::{name}"` under a fixed DNS namespace UUID.
        Tests assert determinism and namespace-sensitivity.
      gap: >-
        A rename is, correctly, an identity change — but it is indistinguishable
        from delete+create. Continuity across a rename is exactly what
        ConceptChange records exist to express; the LSP MUST route rename through
        that machinery rather than pretending identity is preserved.

    - id: CLAIM-005
      claim: "SXR already consumes DomainForge through a proven CLI boundary, and the LSP should reuse that exact contract rather than inventing one."
      level: evidence_backed
      required_evidence: "The adapter implementation."
      current_evidence: >-
        observed — sxr-df/src/adapter.rs `CliDomainForgeAdapter::resolve()` runs
        `domainforge envelope --emit both [--pack id=hash]... [--default-namespace ns]
        --scope <canonical-json> <entry_logical_path>` with cwd = semantic root,
        accepting exit 0 or 1, classifying strictly by envelope SHAPE not exit
        code, and parsing `{"representation": D, "cep_envelope": E}`.
        Cargo.toml description: "CliDomainForgeAdapter: SemanticSourcePort over
        the domainforge envelope CLI."
      gap: >-
        The LSP MUST use the in-process library call, not the subprocess, on the
        editor hot path (process spawn per keystroke is not viable). Both paths
        MUST produce identical semantic_closure_hash; that equality is a required
        test (see validation_matrix).

    - id: CLAIM-006
      claim: "The `cep` repository exposes NO callable per-declaration evaluation boundary. It is a specification and conformance-corpus authority."
      level: evidence_backed
      required_evidence: "The complete CLI and module surface."
      current_evidence: >-
        observed — cep/src/cep/cli.py commands: doctor, validate-schemas,
        validate-reality-gap-corpus, validate-semantic-envelope, validate-all,
        conformance-anti-collapse, run-reality-gap, run-reality-gap-corpus,
        run-authority-corpus, run-settlement-corpus, run-capability-corpus,
        score-settlement. Modules: detect, inventory, io, reports, scoring,
        validation, schema_profile, conformance, benchmarks, exporters.
        Every entry point operates on benchmark CASE DIRECTORIES, not on a live
        model or declaration.
      gap: >-
        There is no `cep evaluate <declaration>`. Any LSP feature phrased as
        "ask CEP about this symbol" is unimplementable. The runtime evaluation
        surface is sxr (question/threshold/claim/evidence/settlement/residual/
        diagnostic), which implements CEP's distinctions.

    - id: CLAIM-007
      claim: "Two distinct artifacts are both called 'semantic envelope' and MUST NOT be conflated."
      level: evidence_backed
      required_evidence: "Both schemas."
      current_evidence: >-
        observed — (A) DomainForge `CanonicalSemanticEnvelope`: the RESOLVED
        MODEL (modules, declarations, resolved_references, closure hash).
        (B) CEP `schemas/semantic-envelope.schema.json`, titled "CEP-0008
        Semantic Envelope (v1 flat profile)", required fields
        [schema_version, event_id, source_agent, occurred_at, payload,
        provenance] — a TRANSPORT/EVENT envelope whose `payload` is explicitly
        an "opaque carrier". cep/schemas/semantic-envelope.mapping.md documents
        the field mapping and an unresolved gap (OQ-0009) where CEP-0008 §52
        requires scope/boundary_record/completeness_status/omission_status that
        the v1 flat contract has no top-level field for.
      gap: >-
        In sxr-df the two appear together as `{"representation": D,
        "cep_envelope": E}` — D is (A), E is (B). The LSP's types MUST name them
        distinctly (`CanonicalEnvelope` vs `CepEventEnvelope`). Collapsing them
        would be an anti-collapse violation in the tool built to preserve
        anti-collapse.

    - id: CLAIM-008
      claim: "The current LSP duplicates no grammar, but its symbol resolution is hand-rolled and buffer-local."
      level: partially_proven
      required_evidence: "A duplication audit after the build is restored."
      current_evidence: >-
        observed — no `Regex` dependency and no regex use in hover/symbol_resolver.rs;
        parsing goes through `sea_core::parse_to_graph`. But navigation.rs (154 LOC),
        hover/symbol_resolver.rs (1,146 LOC) and code_actions.rs (967 LOC, 4
        string-prefix heuristics) implement name/offset resolution locally.
      gap: >-
        Cannot be fully audited until the crate compiles. The 1,146-line
        symbol_resolver is the primary suspect for logic that
        `resolved_references` already provides canonically.

    - id: CLAIM-009
      claim: "SXR's read surface is too narrow for declaration-keyed editor queries AND its one query command is not side-effect free."
      level: evidence_backed
      required_evidence: "The CLI query surface and the query implementation."
      current_evidence: >-
        observed — sxr-cli/src/main.rs `QueryCmds` has exactly one variant:
        `Evidence { repo: String, entity: String }`. Other read commands:
        `explain <record_id>`, `context --repo --failure`, `semantic status --repo`,
        `projections status --repo`. Global `--json` flag exists.
        observed — sxr-cli/src/commands.rs:2378 `query_evidence` is NOT read-only.
        It calls `state::require_enrollment`, then
        `durability::ensure_committed(ctx, repo_id, &[entity])` ("F-19b: a queried
        entity must be committed, not pending"), then `projections::rebuild(ctx,
        repo_id)` — it REBUILDS THE PROJECTION STORE as a precondition of
        answering, before delegating to
        `projections::query_evidence_declared(&conn, repo_id, entity)`.
      gap: >-
        Two gaps, not one. (a) No `sxr query --declaration <declkey>` returning
        records whose subject_refs include that declaration. (b) The existing
        query command writes, so the LSP MUST NOT call it — doing so from an
        editor would mutate sxr state as a side effect of inspection, violating
        REQ-OBS-001 and REQ-SEC-001. SXR-C1 must therefore deliver a genuinely
        side-effect-free read path, not merely a new argument on the existing one.

    - id: CLAIM-010
      claim: "Editor-latency feasibility of full-workspace envelope resolution per edit is unmeasured."
      level: assumption
      required_evidence: "A benchmark on a representative multi-module workspace."
      current_evidence: >-
        observed — `resolve_semantic_envelope_with_packs` takes the WHOLE source
        map and resolves from the entry point; there is no incremental or
        partial-invalidation entry point. It also calls
        `enforce_source_map_budget`, implying a bounded input size.
      gap: >-
        If full re-resolution exceeds the debounce budget, an incremental
        resolution API is required upstream (DF-C4, roadmap). Until measured,
        the design MUST assume it may be too slow and keep the syntax tier
        independent of it.

# -----------------------------------------------------------------------------
# 8. SYSTEM OVERVIEW
# -----------------------------------------------------------------------------
system_overview:
  architecture_pattern:
    primary: "Layered semantic service with a single internal query facade and typed optional adapters (ports & adapters at every external edge)."
    rationale: >-
      The failure that broke this repository was a direct, unversioned,
      structural coupling to an upstream crate path. The failure that would
      break the next version is business logic scattered across protocol
      handlers. A single query facade fed by canonical upstream data, with
      every external system behind a typed port that has an explicit
      unavailable state, addresses both.
    intentionally_not_used:
      - pattern: "Independent LSP-side parser/resolver"
        why: "This is precisely the duplication that produced FM-DRIFT-DOC. Grammar and resolution stay in domainforge-core."
      - pattern: "Handler-local logic (each of hover/definition/references/codeAction computing its own answers)"
        why: "Guarantees divergence between projections of the same fact; already visible in the 1,146-line symbol_resolver."
      - pattern: "Synchronous external calls (sxr subprocess) inside LSP request handlers"
        why: "Ordinary editing must never depend on RealityTrace availability or latency."
      - pattern: "LSP-owned evaluation logic"
        why: "Would make the editor an evaluation authority, collapsing the boundary the whole ecosystem exists to preserve."

  main_components:
    - id: L0
      name: "Document & Text Service"
      responsibility: "Buffer state, versions, incremental sync, UTF-16<->byte offset mapping via LineIndex."
      owns: "Open document contents and versions."
      must_not: "Interpret .sea syntax."

    - id: L1
      name: "Syntax Service"
      responsibility: "Per-document parse and format via domainforge_core::{parser, formatter}. Always available, never blocked."
      owns: "Per-document AST + parse diagnostics + format edits."
      must_not: "Attempt cross-file resolution."

    - id: L2
      name: "Envelope Service (workspace semantic index)"
      responsibility: "Assemble the workspace SourceMap (open buffers override disk), call domainforge_core::application::envelope::resolve_semantic_envelope_with_packs, cache the resulting CanonicalSemanticEnvelopeDocument keyed by source_set_hash + semantic_pack_set_hash."
      owns: "The current envelope, its semantic_closure_hash, and its ApplicationDiagnostics."
      must_not: "Re-derive module resolution, reference resolution, or hashing."

    - id: L3
      name: "Span Binding Service"
      responsibility: "Maintain a bidirectional map DeclarationKey <-> (logical_module_id, SourceRange) for declarations and reference sites, sourced from the upstream span sidecar (DF-C3)."
      owns: "The position<->identity binding, and only it."
      must_not: "Treat a source position as an identity, or synthesize a key when the sidecar is absent."

    - id: L4
      name: "SemanticQuery Facade"
      responsibility: "The single internal API every LSP projection consults. Declaration lookup, dependents/dependencies, governance (policy/authority/pack status), units/dimensions, evolution, and enrichment handles."
      owns: "Query semantics and result shapes."
      must_not: "Know about LSP types, VS Code, or markdown."

    - id: L5
      name: "Evolution & Impact Service"
      responsibility: "Pack diff (semantic_pack::diff_packs -> DiffClassification), meaning fingerprint / definition hash comparison, closure-hash delta, ConceptChange association, downstream impact over resolved_references and projection consumers."
      owns: "Change classification and impact sets."
      must_not: "Decide whether a change is permitted — that is governance, and it is declared, not computed here."

    - id: L6
      name: "Observation Port (RealityTrace adapter)"
      responsibility: "Read-only, out-of-band, cancellable queries to sxr keyed by DeclarationKey; returns typed Available/Unavailable/Stale."
      owns: "The sxr boundary and its failure typing."
      must_not: "Write to the ledger, verify hashes itself, re-implement provenance, or run on a hot path."

    - id: L7
      name: "Evaluation Projection"
      responsibility: "Project question/threshold/claim/evidence/settlement/residual/diagnostic records — obtained through L6 — into editor-legible states, preserving CEP distinctions."
      owns: "Presentation of evaluation state."
      must_not: "Compute settlement, score, or infer a verdict from absent evidence."

    - id: L8
      name: "Affordance Service"
      responsibility: "Turn resolved conditions into AffordanceRecords with explicit gate state; evaluate gates before anything is offered as available."
      owns: "Action availability semantics."
      must_not: "Convert a governance gate into a ranking or recommendation score."

    - id: L9
      name: "LSP Protocol Projection"
      responsibility: "Map L4..L8 results onto LSP types. Thin, mechanical, testable."
      owns: "Wire format."
      must_not: "Contain semantic decisions."

    - id: L10
      name: "VS Code Client (separate repo)"
      responsibility: "Trees, graph views, webviews, multi-step command UX, presentation of custom domainforge/* results."
      owns: "VS Code-specific UX."
      must_not: "Re-derive semantics; it consumes server results only."

  component_diagram:
    mermaid: |-
      flowchart TB
        subgraph UP["Upstream authorities (not owned by the LSP)"]
          DF["domainforge-core 0.16+\nlibrary: parser, formatter,\nsemantic_pack, application::envelope"]
          SXR["sxr (RealityTrace)\nledger: 27 record kinds\nkeyed by DeclKey"]
          CEP["cep\nspecification + conformance corpus\n(no runtime eval API)"]
        end
        subgraph LSP["domainforge-lsp"]
          L0["L0 Document/Text"] --> L1["L1 Syntax"]
          L1 --> L2["L2 Envelope Service"]
          L2 --> L3["L3 Span Binding"]
          L2 --> L4["L4 SemanticQuery facade"]
          L3 --> L4
          L4 --> L5["L5 Evolution & Impact"]
          L4 --> L8["L8 Affordance"]
          L6["L6 Observation Port"] -.deferred.-> L4
          L6 --> L7["L7 Evaluation Projection"]
          L7 -.deferred.-> L8
          L4 --> L9["L9 LSP Projection"]
          L5 --> L9
          L8 --> L9
        end
        DF -->|"in-process library call"| L1
        DF -->|"resolve_semantic_envelope_with_packs"| L2
        DF -.->|"span sidecar DF-C3"| L3
        SXR -->|"read-only CLI --json, out-of-band"| L6
        CEP -.->|"defines distinctions; no call"| L7
        L9 --> C["LSP clients (portable)"]
        L9 --> V["L10 VS Code extension\n(domainforge/* extensions)"]

  external_dependencies:
    - name: "domainforge-core"
      kind: "Rust library (required)"
      version_constraint: ">=0.16, <0.17 — see compatibility contract"
      failure_mode: "Build-time. A version outside the range MUST fail the build, not degrade at runtime."
    - name: "sxr binary"
      kind: "External process, read-only (optional)"
      version_constraint: "Discovered at runtime; capability-probed, not assumed."
      failure_mode: "Runtime, typed unavailable. MUST NOT affect representation-tier behavior."
    - name: "cep"
      kind: "Specification only (no runtime dependency)"
      version_constraint: "N/A"
      failure_mode: "N/A — the LSP never calls it."
    - name: "tower-lsp"
      kind: "Rust library"
      version_constraint: "0.20 (current). Migration to a maintained LSP crate is roadmap, not required."
      failure_mode: "Build-time."

# -----------------------------------------------------------------------------
# 9. CORE DOMAIN MODEL
# -----------------------------------------------------------------------------
core_domain_model:
  scope_rule: >-
    The smallest model preserving the distinctions the ecosystem depends on:
    identity, tier, epistemic status, and gate state. Anything expressible by
    re-reading the canonical envelope is NOT modelled here.

  entities:
    - name: DeclarationKey
      purpose: "The identity spine. Joins source, pack, envelope, trace, and evaluation."
      definition: >-
        A newtype over the canonical string form of DomainForge's
        CanonicalDeclarationId, byte-identical to sxr DeclKey::as_str():
        `concept:{uuid}` | `application:{symbol}` |
        `occurrence:{kind}:{content_hash}:{duplicate_index}`.
      invariants:
        - "MUST be derived from the canonical envelope, never constructed from a cursor position."
        - "MUST be stable across whitespace/formatting changes, comment edits, and file moves that preserve logical_module_id."
        - "MUST change when namespace or name changes — that is a real identity change, surfaced as such."
        - "MUST round-trip: DeclarationKey -> range -> DeclarationKey is the identity function within one envelope version."

    - name: IdentityFacet
      purpose: "Prevents collapsing distinct notions of sameness."
      facets:
        syntactic: "A source range in a buffer. Ephemeral. Never an identity."
        declared: "namespace + name as written."
        semantic: "ConceptId = UUIDv5(namespace::name). Stable, deterministic."
        module_content: "CanonicalModuleRef.semantic_content_hash — per-module semantic content."
        model_closure: "semantic_closure_hash — the whole resolved envelope."
        document: "envelope_document_self_hash — the document including producer and inputs."
        pack_content: "compute_pack_content_hash — pack bytes minus signature/timestamp."
        meaning_fingerprint: "compute_meaning_fingerprint — definition hashes + status + decision refs."
        definition: "compute_definition_hash(text, examples, counterexamples, status)."
        trace: "sxr entry_ulid / record_id."
      rule: >-
        These MUST remain distinct fields. observed: DomainForge already
        computes all of them separately. The LSP MUST NOT introduce a single
        conflated 'version' or 'hash' field in any user-facing projection.

    - name: SemanticFact
      purpose: "Any datum the LSP surfaces."
      fields:
        subject: "DeclarationKey"
        tier: "representation | observation | evaluation"
        source: "Which authority produced it (domainforge-core@ver | sxr@ver | derived)"
        epistemic_status: "valid | invalid | unknown | unavailable | stale"
        as_of: "The identity the fact was computed against (closure hash and/or snapshot id)"
      invariant: "A fact whose `as_of` differs from the current envelope identity MUST be marked `stale`, never silently refreshed or silently shown as current."

    - name: DiagnosticRecord
      purpose: "Typed diagnostic preserving tier and epistemic status."
      fields: "source, code, severity, semantic_truth, subject (DeclarationKey, optional), range, related_information, evidence_ref, actionability, staleness"

    - name: AffordanceRecord
      purpose: "A candidate next action with its gate."
      fields: "id, title, trigger_condition, tier, gate_state, preconditions, authority_assumption, execution (mechanism), expected_result, settlement_path, failure_behavior, reversibility"

    - name: IntegrationState
      purpose: "Typed optionality for every external port."
      values: "available{version} | not_configured | binary_missing | incompatible_version{found, required} | timeout | error{message} | disabled_by_config"
      rule: "MUST be a value, never an absence, and MUST be renderable to the user as a reason."

  identifiers_and_normalization:
    - "logical_module_id is the workspace-relative logical path used by DomainForge. observed: sxr-df requires it be relative, never absolute, because 'the producer embeds it in the envelope scope verbatim'. The LSP MUST apply the same rule when converting a file:// URI."
    - "URI<->logical_module_id conversion MUST be a single audited function; path handling divergence would silently break the trace join."
    - "All hashes are `sha256:<64 lowercase hex>`. observed — domainforge-core envelope.rs `is_hash()` enforces exactly this."

# -----------------------------------------------------------------------------
# 10. CONFIGURATION AND INPUT CONTRACT
# -----------------------------------------------------------------------------
configuration_and_input_contract:
  configuration_sources_precedence:
    - "1. LSP `workspace/didChangeConfiguration` / `workspace/configuration` (client-supplied, highest)."
    - "2. `domainforge-lsp.toml` at the workspace root."
    - "3. `.sea-registry.toml` at the workspace root, for registry/namespace discovery only. observed: this file exists in the domainforge repo root."
    - "4. Built-in defaults (lowest)."

  resolution_rules:
    - "TOML is the file format. observed: the DomainForge ecosystem already uses .sea-registry.toml and Cargo.toml conventions."
    - "MUST NOT read runtime behavior from Markdown."
    - "MUST NOT hardcode absolute paths. The sxr binary MUST be discovered via config key, then PATH; never a baked-in path."
    - "Environment variables are permitted ONLY for secrets and for CI overrides, never as the primary configuration surface."
    - "Command-line flags on the server binary are limited to transport and logging. Semantic configuration MUST come from the sources above."

  required_config_fields:
    - key: "domainforge.workspace.entry"
      type: "string (logical path)"
      required: false
      default: "implementation-defined discovery; outcome: a deterministic, reported choice"
      note: "The envelope is resolved from an entry point. observed: resolve_semantic_envelope_with_packs takes entry_logical_path. Multi-entry workspaces are an open question (OQ-3)."
    - key: "domainforge.packs"
      type: "array of {id, content_hash, path}"
      required: false
      default: "[] (observed: the empty pack set is the documented Milestone 0 default)"
    - key: "domainforge.realitytrace.enabled"
      type: "bool"
      required: false
      default: "false"
      note: "Observation tier is OFF by default. It performs process execution; opt-in is a governance requirement, not a preference."
    - key: "domainforge.realitytrace.binary"
      type: "string path"
      required: false
      default: "`sxr` resolved on PATH"
    - key: "domainforge.realitytrace.repo"
      type: "string"
      required: false
      note: "observed: every sxr read command requires --repo."
    - key: "domainforge.realitytrace.timeoutMs"
      type: "integer"
      required: false
      default: "2000"

  error_classes:
    - class: "config_invalid"
      behavior: "Report via window/showMessage AND a workspace diagnostic. Fall back to defaults for the invalid key only. MUST NOT abort the server."
    - class: "entry_not_found"
      behavior: "Envelope tier enters IntegrationState::not_configured. Syntax tier continues fully."
    - class: "pack_unreadable"
      behavior: "Typed pack diagnostic (PackUnavailable). observed: domainforge-core already defines SemanticDiagnosticCode::PackUnavailable — reuse it, do not invent a code."

  error_surface_requirements:
    - "Every degraded tier MUST be visible to the user as a reason, not as silence."
    - "A configuration error MUST NOT be reported as a syntax error in a .sea file."

  dynamic_reload:
    - "Configuration changes MUST invalidate the envelope cache and re-resolve; they MUST NOT require a server restart."
    - "Toggling realitytrace.enabled off MUST cancel in-flight sxr queries and clear observation-tier state."

  startup_preflight:
    - "Record domainforge-core version compiled against (compile-time constant)."
    - "If realitytrace.enabled, probe the sxr binary once (version/doctor), record IntegrationState, and never block initialize on it."
    - "Report the resulting tier availability to the client in the initialize result extension so the client can render honest UI affordances."

  primary_input:
    description: "The set of .sea sources in the workspace plus open unsaved buffers."
    rule: >-
      Open buffers MUST override on-disk contents when building the SourceMap,
      so the envelope reflects what the user is looking at. observed: the API
      accepts an in-memory source map, so this requires no filesystem writes.

# -----------------------------------------------------------------------------
# 11. OPERATIONAL FLOW AND STATE MODEL
# -----------------------------------------------------------------------------
operational_flow_and_state_model:
  flow_summary:
    - "didOpen/didChange -> L0 updates buffer -> L1 parses (immediate, syntax diagnostics published)."
    - "Debounced -> L2 rebuilds SourceMap, re-resolves envelope, updates L3 span bindings and L4 caches; envelope diagnostics published as a separate, typed stream."
    - "On demand (hover/definition/references/codeLens) -> L9 asks L4; answers come from cache; representation tier answers synchronously."
    - "Enrichment: if observation tier is enabled, L6 issues a cancellable out-of-band query keyed by DeclarationKey; results arrive later and are pushed as a refresh, never awaited inline."
    - "Actions: a client executeCommand asks L8 to re-evaluate the gate at execution time, then performs the governed action."

  flow_diagram:
    mermaid: |-
      sequenceDiagram
        participant Ed as Editor
        participant L0 as L0/L1 Syntax
        participant L2 as L2 Envelope
        participant L4 as L4 Query
        participant L6 as L6 Observation (optional)
        Ed->>L0: didChange
        L0-->>Ed: syntax diagnostics (immediate)
        L0->>L2: debounced rebuild
        L2->>L2: resolve_semantic_envelope_with_packs
        L2-->>Ed: envelope diagnostics (typed, separate source)
        Ed->>L4: hover(position)
        L4->>L4: span binding -> DeclarationKey -> facts
        L4-->>Ed: representation-tier hover (sync)
        L4->>L6: enrich(DeclarationKey) [spawned, cancellable]
        L6-->>Ed: refresh / lens update (later, or typed unavailable)

  service_states:
    - "starting"
    - "syntax_only        — L1 available; envelope not yet resolved or unavailable"
    - "representation     — envelope resolved; full local semantics"
    - "enriched           — representation + observation and/or evaluation available"
    - "degraded           — one or more optional tiers in a typed unavailable state"
    - "shutting_down"

  transition_rules:
    - "syntax_only is the floor. The server MUST reach and remain able to serve syntax_only regardless of any other failure."
    - "A transition to `degraded` MUST NOT remove any representation-tier capability."
    - "A failure in L6/L7 MUST NOT transition the server out of `representation`."

  idempotency_rule: >-
    Re-resolving the envelope with an unchanged (source_set_hash,
    semantic_pack_set_hash) MUST be a cache hit and MUST produce an identical
    semantic_closure_hash. A differing hash for identical inputs is a
    determinism defect and MUST fail the determinism gate.

  important_nuances:
    - "Classify by SHAPE, not exit code. observed — sxr-df/adapter.rs documents this explicitly: `envelope --emit cep` exits 1 for any model-validation failure, but a validated model with diagnostics and an unconstructable model are different outcomes sharing exit 1. The LSP MUST replicate this discipline: a model that resolved-with-diagnostics is Resolved; only a model where D could not be constructed is ValidationFailed."
    - "observed — sxr-core SemanticContext models exactly this closed sum: Resolved{content_hash, semantic_closure_hash, declarations, diagnostics} | ValidationFailed{invalid_declared_checkpoint_hash, representation_omission, diagnostics}. The LSP SHOULD mirror this sum type rather than using Option."
    - "An unconstructable model MUST still leave syntax-tier features working per-file."

# -----------------------------------------------------------------------------
# 12. CORE BEHAVIOR REQUIREMENTS
# -----------------------------------------------------------------------------
core_behavior_requirements:

  canonical_dependency:
    - id: REQ-CANON-001
      text: "The LSP MUST depend on domainforge-core as a named, version-constrained Cargo dependency. It MUST NOT depend on a bare filesystem path that can be deleted by an upstream rename."
    - id: REQ-CANON-002
      text: "The LSP MUST NOT contain a .sea grammar, tokenizer, or parser. All parsing MUST go through domainforge_core::parser."
    - id: REQ-CANON-003
      text: "The LSP MUST NOT implement module resolution, import resolution, namespace binding, or reference resolution. All of these MUST be read from the canonical envelope."
    - id: REQ-CANON-004
      text: "The LSP MUST NOT compute any semantic hash itself. All hashes MUST be obtained from domainforge-core functions."
    - id: REQ-CANON-005
      text: "The LSP MUST NOT re-implement formatting. Formatting MUST delegate to domainforge_core::formatter."
    - id: REQ-CANON-006
      text: "A CI gate MUST fail the build if the LSP source introduces a grammar file, a regex over .sea syntax, or a local hash computation over semantic content."

  identity:
    - id: REQ-ID-001
      text: "The LSP MUST represent declaration identity as DeclarationKey, byte-identical to sxr DeclKey::as_str()."
    - id: REQ-ID-002
      text: "The LSP MUST NOT use a source position, byte offset, or line/column pair as a durable identity in any cache key, action payload, or external query."
    - id: REQ-ID-003
      text: "A formatting-only edit MUST leave every DeclarationKey and the semantic_closure_hash unchanged."
    - id: REQ-ID-004
      text: "A file move that preserves logical_module_id MUST leave every Concept-kind DeclarationKey unchanged."
    - id: REQ-ID-005
      text: "A rename or renamespacing MUST be surfaced as an identity change, and the LSP MUST offer the ConceptChange affordance rather than implying continuity."
    - id: REQ-ID-006
      text: "The LSP MUST keep the identity facets in IdentityFacet distinct in every projection. It MUST NOT present a single conflated 'version' or 'hash'."
    - id: REQ-ID-007
      text: "When the span sidecar (DF-C3) is unavailable, the LSP MUST report the envelope tier as degraded for position-keyed features. It MUST NOT synthesize a DeclarationKey by name matching."

  workspace_index:
    - id: REQ-IDX-001
      text: "The workspace semantic index MUST be the CanonicalSemanticEnvelopeDocument returned by domainforge-core, cached, not a parallel structure derived from it."
    - id: REQ-IDX-002
      text: "The SourceMap MUST use open buffer contents in preference to on-disk contents."
    - id: REQ-IDX-003
      text: "logical_module_id MUST be workspace-relative, never absolute."
    - id: REQ-IDX-004
      text: "The cache MUST be keyed by (source_set_hash, semantic_pack_set_hash) and MUST be bounded; an unbounded cache is a defect."
    - id: REQ-IDX-005
      text: "Envelope resolution MUST be cancellable and debounced; a superseded resolution MUST NOT publish its results."
    - id: REQ-IDX-006
      text: "When resolution yields ValidationFailed, the LSP MUST retain the last successful envelope for navigation, marked stale, rather than dropping all semantic capability."

  query_service:
    - id: REQ-QRY-001
      text: "Every LSP handler MUST obtain its answer from the SemanticQuery facade. A handler MUST NOT resolve symbols, walk the envelope, or compute impact itself."
    - id: REQ-QRY-002
      text: "The facade MUST NOT reference LSP or VS Code types, so it remains independently testable."
    - id: REQ-QRY-003
      text: "Two projections of the same fact (e.g. hover and code lens) MUST call the same facade method, so they cannot disagree."

  diagnostics:
    - id: REQ-DIAG-001
      text: "Every diagnostic MUST carry a `source` identifying its tier and authority, drawn from a closed set: domainforge.syntax, domainforge.semantic, domainforge.envelope, domainforge.pack, domainforge.evolution, realitytrace.drift, realitytrace.evidence, evaluation.residual, integration.unavailable."
    - id: REQ-DIAG-002
      text: "A diagnostic originating from observation or evaluation MUST NOT be published with LSP severity Error. It MUST use Information or Hint and carry its epistemic status explicitly."
    - id: REQ-DIAG-003
      text: "The LSP MUST preserve domainforge-core's SemanticTruth {Valid, Invalid, Unknown}. `Unknown` MUST NOT be rendered as valid or omitted."
    - id: REQ-DIAG-004
      text: "Diagnostic codes originating from domainforge-core MUST reuse SemanticDiagnosticCode verbatim. The LSP MUST NOT invent parallel codes for conditions upstream already names."
    - id: REQ-DIAG-005
      text: "A diagnostic MUST NOT be attributed to a source range the user cannot act on. Whole-model conditions MUST be published as workspace-level diagnostics or on the entry module, not scattered onto arbitrary declarations."
    - id: REQ-DIAG-006
      text: "A stale observation or evaluation diagnostic MUST be labelled with the identity it was computed against and MUST NOT be presented as current."
    - id: REQ-DIAG-007
      text: "Unavailability of an optional integration MUST be surfaced once, at workspace level, as `integration.unavailable` — not repeated per declaration."

  evolution_and_impact:
    - id: REQ-EVO-001
      text: "Change classification MUST come from domainforge_core::semantic_pack::diff_packs / DiffClassification {Additive, DefinitionalChange, Deprecating, Breaking, GovernanceCritical, SignatureOnly}. The LSP MUST NOT invent its own severity ladder for semantic change."
    - id: REQ-EVO-002
      text: "Downstream impact MUST be computed from the envelope's resolved_references, not from textual search."
    - id: REQ-EVO-003
      text: "The LSP MUST distinguish what is answerable statically from the envelope, from packs, from RealityTrace, and only by running a command; and MUST label each answer accordingly."
    - id: REQ-EVO-004
      text: "When a change is classified Breaking or GovernanceCritical, the LSP MUST surface whether a ConceptChange already describes it before offering to create one."

  observation_port:
    - id: REQ-OBS-001
      text: "All RealityTrace access MUST be read-only. The LSP MUST NOT invoke any sxr command that appends to the ledger."
    - id: REQ-OBS-002
      text: "RealityTrace access MUST be disabled by default and MUST require explicit configuration to enable."
    - id: REQ-OBS-003
      text: "No LSP request handler may block on a RealityTrace query. Observation results MUST be delivered out of band."
    - id: REQ-OBS-004
      text: "Every RealityTrace query MUST have a timeout and MUST be cancellable; a timeout MUST produce IntegrationState::timeout, not an error diagnostic on the model."
    - id: REQ-OBS-005
      text: "The LSP MUST NOT verify hash chains, re-derive provenance, or re-check evidence qualification. It projects records as sxr reports them."
    - id: REQ-OBS-006
      text: "Observation results MUST be bound to the snapshot identity they were computed against, and MUST be marked stale when the current closure hash differs."
    - id: REQ-OBS-007
      text: "The LSP MUST preserve the four projection-freshness states returned by the declaration query — current, stale{projection_head, ledger_head}, absent, pending{uncommitted_entities} — as distinct user-facing states. It MUST NOT collapse them into present/absent, MUST NOT render stale or pending records as current, and MUST NOT trigger a projection rebuild to resolve staleness on a passive path. Rebuild, if offered at all, is a governed execution requiring explicit user action."

  evaluation_projection:
    - id: REQ-EVAL-001
      text: "The LSP MUST NOT compute settlement, thresholds, scores, or conformance verdicts."
    - id: REQ-EVAL-002
      text: "The LSP MUST NOT call the `cep` Python package. observed: it exposes no per-declaration evaluation entry point (CLAIM-006)."
    - id: REQ-EVAL-003
      text: "Evaluation state MUST preserve CEP's distinctions: a claim is not evidence; evidence is not settlement; settlement is not approval; absence of evidence is not a negative result."
    - id: REQ-EVAL-004
      text: "Absent evidence MUST be rendered as `unknown` / `no evidence recorded`, never as `failing` or `passing`."
    - id: REQ-EVAL-005
      text: "The two envelope kinds MUST be represented by distinct types with distinct names (CanonicalEnvelope vs CepEventEnvelope). Conflating them is a conformance failure."

  affordances:
    - id: REQ-AFF-001
      text: "Every offered action MUST be an AffordanceRecord with an explicit gate_state from: informational, available, blocked, requires_evidence, requires_authority, requires_settlement, unavailable."
    - id: REQ-AFF-002
      text: "An action whose gate is not satisfied MUST NOT be presented as available. It MAY be presented as blocked with its reason."
    - id: REQ-AFF-003
      text: "A gate MUST NOT be represented as a numeric score, confidence, or ranking."
    - id: REQ-AFF-004
      text: "Gates MUST be re-evaluated at execution time, not only at offer time."
    - id: REQ-AFF-005
      text: "Every AffordanceRecord MUST declare preconditions, authority assumption, execution mechanism, expected result, settlement path, failure behavior, and reversibility."
    - id: REQ-AFF-006
      text: "An affordance whose execution mechanism does not yet exist MUST be classified `unavailable` (future) and MUST NOT appear in code actions."

  configuration:
    - id: REQ-CFG-001
      text: "Configuration MUST resolve in the precedence order: LSP client configuration, then domainforge-lsp.toml, then .sea-registry.toml (registry/namespace discovery only), then built-in defaults."
    - id: REQ-CFG-002
      text: "Runtime behavior MUST NOT be derived from prose Markdown. Machine-readable TOML is the file format."
    - id: REQ-CFG-003
      text: "The LSP MUST NOT hardcode environment-specific absolute paths. External binaries MUST be resolved from configuration, then PATH."
    - id: REQ-CFG-004
      text: "Configuration changes MUST take effect without a server restart, invalidating dependent caches; disabling a tier MUST cancel that tier's in-flight work."
    - id: REQ-CFG-005
      text: "An invalid configuration key MUST degrade only that key to its default, MUST be reported to the user, and MUST NOT abort the server or surface as a .sea syntax error."

  degraded_mode:
    - id: REQ-DEG-001
      text: "Tier T0 (syntax: parse, format, syntax diagnostics, document symbols) MUST function with no envelope, no packs, no sxr, and no network."
    - id: REQ-DEG-002
      text: "Tier T1 (representation: cross-file navigation, references, governance, impact) MUST function with domainforge-core alone."
    - id: REQ-DEG-003
      text: "Tiers T3 (observation) and T4 (evaluation) MUST be independently removable without affecting T0-T2."
    - id: REQ-DEG-004
      text: "Every unavailable tier MUST report a typed reason. Silent absence is a defect."
    - id: REQ-DEG-005
      text: "The server MUST NOT make any network request. All integration is local process or library."

  security_and_governance:
    - id: REQ-SEC-001
      text: "No passive LSP request (hover, diagnostics, inlay hints, code lens, semantic tokens, document symbols, completion) may spawn a process, write a file, or mutate state outside the LSP's own caches."
    - id: REQ-SEC-002
      text: "Process execution MUST occur only in response to an explicit user action (executeCommand) or an explicitly enabled, read-only, rate-limited background enrichment."
    - id: REQ-SEC-003
      text: "Any action that writes files, rebuilds artifacts, or invokes project tooling MUST require explicit user confirmation and MUST be classified as governed execution."
    - id: REQ-SEC-004
      text: "The LSP MUST constrain all file access to declared workspace roots. observed: src/mcp/guardrails.rs already implements allowed_roots path canonicalization — this discipline MUST be extended to the LSP server, not left only in the MCP bridge."
    - id: REQ-SEC-005
      text: "The MCP bridge MUST NOT advertise a tool whose underlying LSP capability is not declared. observed: `domainforge/rename-preview` is advertised while rename_provider is absent (FM-MCP-OVERREACH)."
    - id: REQ-SEC-006
      text: "Configured external binary paths MUST be validated before execution and MUST NOT be taken from untrusted workspace files without confirmation."

  performance:
    - id: REQ-PERF-001
      text: "Syntax-tier response (parse + publish syntax diagnostics) MUST NOT be gated on envelope resolution."
    - id: REQ-PERF-002
      text: "Envelope re-resolution MUST be debounced and superseded resolutions MUST be cancelled."
    - id: REQ-PERF-003
      text: "Representation-tier request handlers MUST answer from cache without re-resolving."
    - id: REQ-PERF-004
      text: "All caches MUST be bounded with a declared eviction policy."
    - id: REQ-PERF-005
      text: "Cold-start MUST NOT block `initialize`; the server MUST report capabilities immediately and resolve the workspace in the background with progress reporting."
    - id: REQ-PERF-006
      text: "Envelope resolution cost MUST be measured on a representative multi-module fixture and recorded. If it exceeds the debounce budget, the incremental-resolution upstream contract (DF-C4) becomes required rather than roadmap."

  compatibility:
    - id: REQ-COMPAT-001
      text: "The LSP MUST record the domainforge-core version it was built against and expose it in the initialize result."
    - id: REQ-COMPAT-002
      text: "The LSP MUST verify at startup that the envelope schema_version and canonicalization_version it receives are within its supported set, and MUST report a typed incompatibility rather than misinterpreting data."
    - id: REQ-COMPAT-003
      text: "The existing custom method `sea/astJson` MUST continue to work for the current VS Code extension, or a coordinated client release MUST accompany its removal. observed: the extension calls it in two commands (showAstJson, copyAstJson)."
    - id: REQ-COMPAT-004
      text: "Custom methods MUST be namespaced `domainforge/*` and version-negotiated. `textDocument/hoverPlus` MUST be renamed or removed: it occupies the `textDocument/` namespace it does not own and has no consumer (FM-UNUSED-SURFACE)."
    - id: REQ-COMPAT-005
      text: "The compatibility contract MUST be machine-checkable in CI: a job MUST build domainforge-lsp against the current domainforge-core and fail on breakage, so a repeat of the 2026-06-20 silent break is impossible."

  vscode_split:
    - id: REQ-VSC-001
      text: "Portable capabilities MUST be served over standard LSP methods so non-VS-Code clients get a correct experience."
    - id: REQ-VSC-002
      text: "Tree views, graph views, webviews, and multi-step UX MUST live in the VS Code extension and MUST consume server results without re-deriving semantics."
    - id: REQ-VSC-003
      text: "The server MUST NOT emit VS Code-specific markup or assume a VS Code renderer."

  observability:
    - id: REQ-OBSV-001
      text: "The server MUST log, per envelope resolution: duration, source_set_hash, semantic_closure_hash, declaration count, diagnostic count, cache hit/miss."
    - id: REQ-OBSV-002
      text: "Every external process invocation MUST be logged with argv, duration, and exit classification."
    - id: REQ-OBSV-003
      text: "Logs MUST NOT contain .sea source content or secrets."
    - id: REQ-OBSV-004
      text: "The server MUST expose a `domainforge/status` request returning tier states, versions, and cache statistics, so degraded mode is diagnosable without log access."

  completion_rules:
    may_claim_completion_only_when:
      - "cargo build, cargo test, and cargo clippy pass against the pinned domainforge-core."
      - "The determinism gate (identical inputs -> identical semantic_closure_hash) passes."
      - "The library/CLI parity gate (in-process resolution hash == `domainforge envelope` hash) passes."
      - "Degraded-mode tests pass with each optional integration independently absent."
      - "No offered affordance has an unsatisfied gate in the fixture suite."
    must_report_incomplete_blocked_or_failed_when:
      - "An upstream contract (DF-C1..DF-C4, SXR-C1) it depends on is unmet — the dependent capability MUST be reported blocked, not stubbed as working."
      - "The DeclarationKey<->sxr join has been tested only against fixtures and never against a real sxr ledger."
      - "Envelope resolution latency has not been measured on a representative workspace."

# -----------------------------------------------------------------------------
# 13. EXECUTION / INTEGRATION CONTRACT
# -----------------------------------------------------------------------------
execution_integration_contract:

  domainforge_contract:
    kind: "in-process Rust library call (required tier)"
    existing_surface_used:
      - "domainforge_core::parser::{parse, parse_to_graph, parse_to_graph_with_options, ParseOptions}  [observed]"
      - "domainforge_core::formatter  [observed]"
      - "domainforge_core::application::envelope::{resolve_semantic_envelope_with_packs, semantic_closure_hash, envelope_document_self_hash, CanonicalSemanticEnvelopeDocument, CanonicalDeclarationId, CanonicalResolvedReference}  [observed]"
      - "domainforge_core::semantic_pack::{PackSet, merge_packs, diff_packs, DiffClassification, validate_graph_with_pack, validate_semantic_pack, resolve_concept, SemanticDiagnostic, SemanticDiagnosticCode, SemanticTruth, ValidationOptions, compute_pack_content_hash, compute_meaning_fingerprint, compute_definition_hash}  [observed]"
      - "domainforge_core::{ConceptId, Graph, NamespaceRegistry, SemanticVersion, Unit, Dimension, UnitRegistry, ValidationError, SourceRange, Position}  [observed]"
      - "domainforge_core::primitives::concept_change::ConceptChange  [observed]"
      - "domainforge_core::policy (three_valued, quantifier, expression)  [observed]"
      - "domainforge_core::projection::registry  [observed — for enumerating projection consumers]"

    required_upstream_additions:
      - id: DF-C1
        name: "Stable crate identity"
        need: "A version-constrained dependency that survives renames."
        current_state: >-
          observed — LSP pins a deleted path; this is the root cause of the
          outage. observed — domainforge-core IS already published to crates.io
          (release-crates.yml, deploy.yml, release-please manifest 0.16.0), so
          the fix requires NO upstream work at all: depend on the published
          version.
        shape: >-
          `domainforge-core = "0.16"` from crates.io, plus an upstream-compat CI
          job building the LSP against domainforge HEAD, plus an optional
          `[patch.crates-io]` for local co-development. See OQ-8.
        blocking: "Everything. Nothing else can proceed."
        status: "UNBLOCKED — no upstream permission needed; this is LSP-side work only."

      - id: DF-C1a
        name: "Expose source-map assembly and registry discovery"
        need: >-
          The LSP must build the same (entry_logical_path, source_map) pair the
          CLI builds, from the active document, without reimplementing it.
        current_state: >-
          observed — module/resolver.rs:399 `pub(crate) fn
          source_map_from_filesystem(...)` is crate-private. The CLI uses it at
          cli/envelope.rs:29 after `NamespaceRegistry::discover(&target)`.
        shape: >-
          Make `source_map_from_filesystem` public (and confirm
          `NamespaceRegistry::discover` is public). Additive, no semantic change,
          no hash impact. Optionally add an in-memory overlay parameter so the
          LSP can substitute open buffer contents for on-disk contents without
          writing a temp tree.
        blocking: "T02's SourceMap assembly. Small, but genuinely blocking."

      - id: DF-C2
        name: "Envelope schema/canonicalization version exposure"
        need: "The LSP must detect version skew rather than misread data."
        current_state: "observed — ENVELOPE_SCHEMA_VERSION, LANGUAGE_SCHEMA_VERSION, INTERPRETATION_VERSION and CANONICALIZATION_VERSION ('domainforge-canonicalization/v1') exist as constants and appear in the document; they are readable already."
        shape: "Confirm these are public and semver-meaningful. Likely a no-op or a small `pub` change."
        blocking: "REQ-COMPAT-002."

      - id: DF-C3
        name: "Span sidecar + canonical DeclarationKey string form"
        need: >-
          Map cursor position <-> CanonicalDeclarationId without re-deriving
          resolution, and produce a key byte-identical to sxr's DeclKey string.
        current_state: >-
          observed — spans exist as Spanned<T>{line, column} and are in hand at
          envelope build time (envelope.rs:684) but are dropped. The canonical
          string form exists only in sxr (types.rs:49 as_str()). DomainForge
          emits the structured enum, never the string.
        shape: >-
          A separate, optional sidecar structure (NOT inside the hashed envelope
          payload — adding spans to the envelope would change semantic_closure_hash
          and break every existing snapshot) mapping each CanonicalDeclarationId
          to (logical_module_id, SourceRange) for its declaration site, plus
          reference-site ranges for each CanonicalResolvedReference. Plus a
          `Display`/`as_str` on CanonicalDeclarationId matching sxr's encoding
          exactly, with a cross-repo test asserting byte equality.
        blocking: "REQ-ID-001, REQ-ID-007, and every position-keyed semantic feature. This is the single most important upstream item."
        risk_if_done_wrong: "Putting spans inside the hashed envelope would make formatting change the closure hash, destroying the identity property the whole design rests on."

      - id: DF-C4
        name: "Incremental / partial envelope resolution"
        level: roadmap
        need: "Editor-latency resolution on large workspaces."
        current_state: "observed — only whole-source-map resolution exists, with enforce_source_map_budget implying a bounded input."
        shape: "Deferred until REQ-PERF-006 measurement shows it is needed. Until then, debounce + cache is the mitigation."
        blocking: "Nothing now. Promoted to required only if measurement demands it."

  realitytrace_contract:
    kind: "external process, read-only, out-of-band (optional tier)"
    existing_surface_used:
      - "`sxr --json explain <record_id>`  [observed — appears read-only; MUST be confirmed against its implementation before use]"
      - "`sxr --json semantic status --repo <r>`  [observed — status read; confirm no rebuild]"
      - "`sxr --json projections status --repo <r>`  [observed — status read; confirm no rebuild]"
      - "`sxr --json context --repo <r> --failure <f>`  [observed — confirm no rebuild]"
    existing_surface_explicitly_rejected:
      - command: "`sxr --json query evidence --repo <r> --entity <e>`"
        why: >-
          observed — NOT side-effect free. commands.rs:2378 calls
          projections::rebuild() before answering. Calling it from the editor
          would make inspection mutate sxr state, violating REQ-OBS-001 and
          REQ-SEC-001. The LSP MUST NOT invoke it, even behind an explicit user
          action, until a read-only path exists.
    surface_audit_requirement: >-
      Before the Observation Port invokes ANY sxr subcommand, the implementer
      MUST read that subcommand's implementation and confirm it performs no
      write. The `query evidence` case proves that a command's name and its
      `query`/`status` grouping are not evidence of read-only behavior.
    record_vocabulary_projected:
      note: "observed — sxr-core/src/record_kinds.csv, 26 record kinds + header."
      relevant_to_editor:
        - "semantic.snapshot — declared State + DomainForge validation result + Representation D; subject_refs include declaration refs."
        - "semantic.diff — State/Representation difference between two snapshots."
        - "semantic.identity_drift — identity-binding difference; 'revalidation questions only'."
        - "verification.contract_imported — DomainForge Semantic Verification Contract: CEP Questions, Claim/obligation bindings, Evidence requirements. This is the declared->evaluation bridge."
        - "question.declared / threshold.declared — declared evaluation context."
        - "claim.made — 'asserted, not evidenced'."
        - "observation.recorded — 'yes only after qualification'."
        - "evidence.created — question-bound Evidence."
        - "settlement.registered — 'runtime settlement; not approval'."
        - "residual.computed — question-bound declared/observed difference; 'derived; never causal authority'."
        - "diagnostic.hypothesis / diagnostic.settled — 'hypothesis, not verdict' / supported locus only."
        - "proposal.raised — 'no approval/promotion by itself'."
      rule: >-
        The authority_class column in record_kinds.csv states, per record, what
        the record is NOT. The LSP MUST carry those qualifications into its
        projections verbatim. Rendering `claim.made` as if it were evidence, or
        `settlement.registered` as approval, is precisely the collapse this
        ecosystem exists to prevent.

    required_upstream_additions:
      - id: SXR-C1
        name: "Declaration-keyed read query"
        need: "Given a DeclKey, return the records whose subject_refs include it, with kind, ordinal, snapshot binding, and staleness against a given checkpoint hash."
        current_state: >-
          observed — QueryCmds has only `Evidence { repo, entity }`, `entity` is
          not documented as accepting a DeclKey, AND that command rebuilds
          projections before answering (CLAIM-009), so it is unusable from an
          editor at any privilege level.
        invariant_to_preserve: >-
          CONFIRMED BY MAINTAINER (2026-09-03): the `ensure_committed` +
          `projections::rebuild` sequence is a DELIBERATE correctness invariant,
          not incidental convenience. F-19b ("a queried entity must be committed,
          not pending") exists so a caller can never read a projection that does
          not reflect committed ledger state. A read-only path MUST NOT simply
          skip it — doing so would let the editor read a stale projection and
          present it as current, which is the precise collapse
          AFF-INTEGRATION-UNAVAILABLE and REQ-OBS-006 exist to prevent.
        shape: >-
          A side-effect-free `sxr --json query declaration --repo <r> --decl
          <declkey> [--since <checkpoint>]` that reads the existing projection
          store WITHOUT rebuilding, and returns a TYPED freshness state
          alongside the records — at minimum: current (projection reflects
          committed head) | stale{projection_head, ledger_head} | absent
          (never built) | pending{uncommitted_entities}. The caller decides what
          to do about staleness; the command never decides for it.
          Rebuild remains available as today's separate, explicit,
          state-changing command.
        blocking: "All observation-tier and evaluation-tier editor features."
        rationale: >-
          This preserves the F-19b invariant by making it VISIBLE rather than by
          enforcing it through a write. The invariant said 'do not serve
          uncommitted state'; the typed response says 'here is the state, and
          here is exactly how far behind it is'. That is strictly more
          information than a rebuild-then-answer, and it is honest about
          staleness instead of silently eliminating it.
          The LSP MUST render stale and pending as such (REQ-OBS-006), never
          collapsing them into current.
      - id: SXR-C2
        name: "Cheap availability/capability probe"
        need: "Determine tier availability at startup without a full query."
        current_state: "observed — `sxr doctor` exists; its output contract for programmatic use is unverified."
        shape: "Confirm `sxr --json doctor` is stable and machine-readable, or add a `--json` capability probe."
        blocking: "REQ-DEG-004 reporting quality (not correctness)."

  cep_contract:
    kind: "specification only — no runtime call"
    rule: >-
      observed (CLAIM-006): the cep repository provides no per-declaration
      evaluation API. The LSP MUST NOT create one, MUST NOT shell out to `cep`,
      and MUST NOT imply that CEP was consulted. CEP's role in this design is
      normative: it fixes the distinctions (CEP-0001 ontology, CEP-0003 state,
      CEP-0005 question, CEP-0006 evidence, CEP-0007 settlement, CEP-0008
      semantic envelope, CEP-0010 conformance) that REQ-EVAL-003..005 enforce.
    classification:
      implementable_now: "Projecting sxr's CEP-shaped records with their distinctions preserved."
      requires_adapter: "Nothing — sxr already is the adapter."
      requires_new_cross_project_contract: "SXR-C1 (declaration-keyed query)."
      future_capability: "Any live evaluation invoked from the editor. Not designed here; no callable authority exists."

  external_side_effects:
    may_change:
      - "The LSP's own in-memory caches."
      - "Files in the workspace, only via an explicitly confirmed, user-initiated code action or command."
    must_not_change:
      - "The RealityTrace ledger (append is never performed by the LSP)."
      - "Semantic packs, except through an explicit governed rebuild action."
      - "Any file during a passive request."
      - "Anything at all when the user only hovers, reads diagnostics, or opens a file."

# -----------------------------------------------------------------------------
# 14. LSP CAPABILITY MATRIX
# -----------------------------------------------------------------------------
# classification: high_value_now | useful_later | not_semantically_meaningful
#                 | better_in_vscode_client | requires_upstream_first
lsp_capability_matrix:

  - capability: "textDocument/didOpen|didChange|didClose|didSave (incremental sync)"
    status_now: "implemented (FULL sync only)  [observed: capabilities.rs TextDocumentSyncKind::FULL]"
    classification: high_value_now
    semantic_job: "Keep the SourceMap accurate. Move to INCREMENTAL to reduce per-keystroke cost."

  - capability: "textDocument/publishDiagnostics"
    status_now: "implemented, untyped"
    classification: high_value_now
    semantic_job: "Carry the typed taxonomy (REQ-DIAG-*). The single highest-value upgrade."

  - capability: "textDocument/formatting"
    status_now: "implemented, delegates to core"
    classification: high_value_now
    semantic_job: "Canonical formatting; also the proof surface for REQ-ID-003 (format must not change identity)."

  - capability: "textDocument/hover"
    status_now: "implemented (207 + 1146 + 323 LOC), buffer-local"
    classification: high_value_now
    semantic_job: "Progressive disclosure of identity, governance, and status. See hover_information_architecture."

  - capability: "textDocument/definition"
    status_now: "implemented, single-file"
    classification: high_value_now
    semantic_job: "Cross-file navigation via resolved_references. Requires DF-C3."

  - capability: "textDocument/references"
    status_now: "implemented, single-file"
    classification: high_value_now
    semantic_job: "Directly answers 'what depends on this'. resolved_references gives this canonically."

  - capability: "textDocument/documentSymbol"
    status_now: "absent"
    classification: high_value_now
    semantic_job: "Structural navigation; works at T0 from the AST alone. Cheap, no upstream dependency."

  - capability: "workspace/symbol"
    status_now: "absent"
    classification: high_value_now
    semantic_job: "Find a declaration by name across the workspace from the envelope's declaration list."

  - capability: "textDocument/codeAction (+ resolve)"
    status_now: "implemented (967 LOC), quickfix only, heuristic"
    classification: high_value_now
    semantic_job: "The primary affordance surface. MUST be rebuilt on AffordanceRecord with gate enforcement. codeAction/resolve keeps offer-time cheap and defers expensive computation to selection."

  - capability: "textDocument/codeLens (+ resolve)"
    status_now: "absent"
    classification: high_value_now
    semantic_job: "Per-declaration governance and status summary (pack status, dependents count, evolution class, evidence presence) — the natural carrier for deferred observation results, since a lens can be refreshed asynchronously."

  - capability: "textDocument/inlayHint"
    status_now: "absent"
    classification: high_value_now
