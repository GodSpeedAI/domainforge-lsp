    semantic_job: "The execution mechanism for governed affordances (REQ-AFF-004 gate re-check happens here)."

  - capability: "custom: domainforge/status"
    status_now: "absent"
    classification: high_value_now
    semantic_job: "Tier/version/cache introspection (REQ-OBSV-004). Justified: no standard method carries it."

  - capability: "custom: domainforge/semanticInfo"
    status_now: "partially exists as textDocument/hoverPlus (unused)"
    classification: better_in_vscode_client
    semantic_job: >-
      Structured (non-markdown) semantic facts for a rich client to render as
      trees/graphs. Justified only because hover markdown cannot carry structure.
      MUST be renamed out of the textDocument/ namespace (REQ-COMPAT-004).

  - capability: "custom: sea/astJson"
    status_now: "implemented and used by the extension  [observed]"
    classification: high_value_now
    semantic_job: "Debug/inspection. MUST be preserved or migrated with a coordinated client release (REQ-COMPAT-003)."

vscode_specific_capability_matrix:
  - capability: "Semantic impact tree view (dependents of a declaration)"
    rationale: "Hierarchical, persistent, multi-select. LSP has no such surface."
    server_provides: "domainforge/semanticInfo impact projection."
  - capability: "Semantic graph / import graph webview"
    rationale: "Graph rendering is inherently client-side."
    server_provides: "envelope import_graph + resolved_references, as data."
  - capability: "Evidence & settlement panel"
    rationale: "Record lists with drill-down; needs its own viewport."
    server_provides: "observation/evaluation projections keyed by DeclarationKey."
  - capability: "Semantic diff viewer"
    rationale: "Diff UX belongs to the editor."
    server_provides: "diff_packs output as structured data."
  - capability: "Tier status bar item"
    rationale: "Persistent honest indicator of which tiers are live."
    server_provides: "domainforge/status."
  - rule: >-
      Each of these MUST be a pure projection of server data. The extension MUST
      NOT parse .sea, compute identity, or query sxr directly.

# -----------------------------------------------------------------------------
# 15. HOVER INFORMATION ARCHITECTURE
# -----------------------------------------------------------------------------
hover_information_architecture:
  principle: >-
    Hover answers "what is this and is anything wrong with it". It is not a
    dashboard. Everything requiring scroll, structure, or navigation belongs
    elsewhere.

  hover_tiers:
    always: "kind, canonical name, namespace, one-line definition, resolution status."
    conditional_only_if_notable:
      - "pack status when not Approved/Signed (deprecated, proposed, unreviewed, ambiguous)."
      - "unit/dimension when the declaration carries one."
      - "evolution status when the meaning fingerprint differs from the pack baseline."
      - "observation/evaluation status ONLY as a one-line badge with a count, never as a record list."
    never_in_hover:
      - "Full dependent lists (-> references / impact tree)."
      - "Full trace or evidence records (-> panel, via a command)."
      - "Hashes in full (-> a short prefix at most, full value via a command)."
      - "Semantic diffs (-> diff viewer)."

  surface_assignment:
    hover: "Identity + definition + exceptional status."
    inlay_hint: "Units, dimensions, resolved namespace of unqualified references."
    code_lens: "Per-declaration counts and asynchronous status: dependents, evolution class, evidence presence. The right home for deferred observation results because lenses refresh naturally."
    diagnostics: "Anything actionable and wrong."
    code_action: "The governed next move."
    semantic_tokens: "Resolved vs unresolved reference distinction."
    peek_navigation: "definition, references."
    command: "Anything expensive, external, or governed."
    vscode_tree_graph_panel: "Anything hierarchical or relational."

# -----------------------------------------------------------------------------
# 16. AFFORDANCE CATALOGUE (affordance test applied)
# -----------------------------------------------------------------------------
# Each entry answers: trigger, representation, evidence source, action, gate,
# settlement, failure mode. Tier T1 = domainforge only; T3 = requires sxr.
affordance_catalogue:

  - id: AFF-UNRESOLVED-REF
    tier: T1
    trigger: "A CanonicalResolvedReference target is absent, or an ApplicationDiagnostic reports an unresolved reference."
    representation: "Distinguishes 'not declared anywhere' from 'declared but not imported' from 'ambiguous across namespaces' — three different problems that look identical today."
    evidence_source: "Envelope resolved_references + namespace_bindings + ApplicationDiagnostic.context.field_path."
    action: "Create declaration | add import | qualify the reference."
    gate: "available (local, deterministic text edit). Blocked if the envelope is unresolved (cannot tell which of the three it is) — then the action MUST NOT be offered."
    settlement: "Re-resolution succeeds and the diagnostic clears."
    failure_mode_prevented: "Offering 'create declaration' when the symbol exists but is unimported, which creates a duplicate concept and a real identity collision."

  - id: AFF-PACK-STATUS
    tier: T1
    trigger: "SemanticDiagnosticCode in {DeprecatedConcept, ProposedConcept, RejectedConcept, UnreviewedConcept, AmbiguousAlias, AliasConflict}."
    representation: "Governance state of the term, distinct from whether it parses."
    evidence_source: "domainforge_core::semantic_pack::resolve_concept against the configured PackSet."
    action: "Show the concept definition, its status, and its approved alternative."
    gate: "informational. Substituting the term automatically is NOT offered: term choice is a governance decision, not a refactor."
    settlement: "The author changes the term and the diagnostic clears."
    failure_mode_prevented: "Auto-fixing a governance signal, which converts a deliberate review gate into a silent edit."

  - id: AFF-PACK-INTEGRITY
    tier: T1
    trigger: "SemanticDiagnosticCode in {PackUnavailable, PackHashMismatch, PackVersionMismatch, PackSignatureInvalid, PackUnsigned, PackSetConflict}."
    representation: "The pack the model is being validated against is not the pack that was approved."
    evidence_source: "compute_pack_content_hash vs configured content_hash; PackTrust.signature_state."
    action: "Open pack status; rebuild or re-fetch the pack."
    gate: "requires_authority for anything that changes trust state. A signature failure MUST NOT be offered a 'fix' — only an inspection."
    settlement: "Recomputed content hash matches the configured hash."
    failure_mode_prevented: "Presenting a signature failure as a fixable lint, which would train users to dismiss a trust signal."

  - id: AFF-MEANING-CHANGED
    tier: T1
    trigger: "compute_meaning_fingerprint / compute_definition_hash differs from the pack baseline for a concept the model uses."
    representation: "The meaning of a term changed, even though the source text using it did not."
    evidence_source: "semantic_pack::diff_packs -> DiffClassification."
    action: "View the semantic diff for this concept."
    gate: "available (read-only, local)."
    settlement: "The user has seen the diff; classification is displayed verbatim from DiffClassification."
    failure_mode_prevented: "Presenting DefinitionalChange and Breaking identically — the LSP MUST use upstream's classification, not a severity of its own (REQ-EVO-001)."

  - id: AFF-CONCEPTCHANGE
    tier: T1
    trigger: "DiffClassification is Breaking or GovernanceCritical, or a rename would change a ConceptId."
    representation: "Distinguishes a change that already has a governing ConceptChange from one that does not."
    evidence_source: "Envelope CanonicalConceptChangeDecl entries + primitives::concept_change::ConceptChange."
    action: "Open the existing ConceptChange, or draft a new one."
    gate: >-
      'Open existing' = available. 'Create new' = requires_authority: authoring a
      ConceptChange is a governance act. The LSP MAY scaffold the declaration
      text; it MUST NOT imply the change is thereby approved.
    settlement: "A ConceptChange declaration exists in the model covering from_version -> to_version and the envelope resolves."
    failure_mode_prevented: "A one-click 'fix breaking change' that produces a governance artifact nobody reviewed."

  - id: AFF-IMPACT
    tier: T1
    trigger: "Cursor on a declaration with incoming resolved_references."
    representation: "The transitive dependent set, separated into same-module / cross-module / projection consumers."
    evidence_source: "Envelope resolved_references (reverse index) + projection::registry."
    action: "Open the impact tree; preview affected projections."
    gate: "available for inspection. 'Regenerate projection' is governed execution (see AFF-STALE-PROJECTION)."
    settlement: "N/A — inspection only."
    failure_mode_prevented: "Presenting a static reference count as a claim about runtime blast radius. The projection MUST be labelled 'declared dependencies', not 'impact'."

  - id: AFF-STALE-PROJECTION
    tier: T1
    trigger: "A generated artifact's recorded source identity differs from the current semantic_closure_hash."
    representation: "Generated output no longer corresponds to the model."
    evidence_source: "Closure hash comparison against artifact provenance (requires artifacts to record it — see OQ-5)."
    action: "Regenerate the projection."
    gate: "governed execution — requires explicit confirmation; writes files (REQ-SEC-003)."
    settlement: "Regenerated artifact records the current closure hash."
    failure_mode_prevented: "Silent regeneration during a passive request. Explicitly forbidden by REQ-SEC-001."

  - id: AFF-IDENTITY-DRIFT
    tier: T3
    trigger: "The latest sxr semantic.snapshot for this repo carries a checkpoint hash differing from the current semantic_closure_hash, or a semantic.identity_drift record exists."
    representation: "Reality was observed against a different version of the model than the one on screen. This is the core declared-vs-observed distinction."
    evidence_source: "sxr semantic.snapshot / semantic.identity_drift records via SXR-C1."
    action: "Inspect the drift; open the snapshot the observations were made against."
    gate: >-
      available (read-only) when the observation tier is available; otherwise
      unavailable with a typed reason. MUST NOT be offered when sxr is disabled.
    settlement: >-
      Not settleable by the LSP. observed — record_kinds.csv marks
      semantic.identity_drift 'revalidation questions only'. The LSP MUST
      surface that a new snapshot is needed, and MUST NOT create one.
    failure_mode_prevented: >-
      Rendering stale observations as if they described the current model. Every
      observation MUST carry the checkpoint hash it was computed against
      (REQ-OBS-006).

  - id: AFF-EVIDENCE-PRESENT
    tier: T3
    trigger: "evidence.created records exist whose subject_refs include this DeclarationKey."
    representation: "Distinguishes 'evidence exists' from 'a claim was made' from 'settled'."
    evidence_source: "sxr evidence.created / claim.made / settlement.registered."
    action: "Open the evidence; open the settlement."
    gate: "available (read-only)."
    settlement: "N/A — inspection."
    failure_mode_prevented: >-
      Rendering claim.made as evidence. observed — record_kinds.csv authority_class
      for claim.made is literally 'asserted, not evidenced'. The projection MUST
      preserve that word.

  - id: AFF-EVIDENCE-ABSENT
    tier: T3
    trigger: "A verification.contract_imported record declares an evidence requirement bound to this declaration, and no qualifying evidence.created record exists."
    representation: "A declared evidence obligation is unmet — an instrumentation gap, NOT a model error."
    evidence_source: "verification.contract_imported obligation bindings vs evidence.created."
    action: "Inspect the obligation."
    gate: >-
      requires_evidence. The LSP MUST NOT offer to run the verification: that is
      a governed execution owned by sxr's plan/run machinery, with its own
      authority.
    settlement: "Not settleable from the editor."
    failure_mode_prevented: >-
      Reporting an unmet obligation as a model defect (severity Error). Forbidden
      by REQ-DIAG-002 — it is an observation-tier fact and must be Information.

  - id: AFF-RESIDUAL
    tier: T3
    trigger: "A residual.computed record binds this declaration."
    representation: "A question-bound difference between declared and observed."
    evidence_source: "sxr residual.computed."
    action: "Inspect the residual and its question."
    gate: "available (read-only)."
    settlement: >-
      Not settleable by the LSP. observed — residual.computed is 'derived; never
      causal authority' and permits 'diagnostic settlement only'. The LSP MUST
      NOT suggest a code fix from a residual: that would assert causation the
      record explicitly disclaims.
    failure_mode_prevented: >-
      Turning a residual into a quick-fix. This is the most tempting and most
      wrong feature in the whole design.

  - id: AFF-INTEGRATION-UNAVAILABLE
    tier: any
    trigger: "An optional tier is in a non-available IntegrationState."
    representation: "Distinguishes 'no evidence exists' from 'we could not look'."
    evidence_source: "IntegrationState."
    action: "Show the reason; open configuration."
    gate: "informational."
    settlement: "Tier becomes available."
    failure_mode_prevented: >-
      The single most dangerous collapse available to this system: rendering
      'could not query' as 'nothing found'. REQ-DEG-004 exists for this.

# -----------------------------------------------------------------------------
# 17. FAILURE MODEL AND RECOVERY
# -----------------------------------------------------------------------------
failure_model_and_recovery:
  failure_classes:
    - class: "build_incompatibility"
      detection: "Compile time / CI."
      response: "Fail loudly. MUST NOT be degraded at runtime."
    - class: "envelope_unresolvable"
      detection: "resolve_* returns Vec<ApplicationDiagnostic>."
      response: "Publish typed envelope diagnostics; retain the last good envelope marked stale; keep T0 fully functional."
    - class: "span_sidecar_absent"
      detection: "DF-C3 unavailable."
      response: "Position-keyed semantic features report degraded. MUST NOT fall back to name matching (REQ-ID-007)."
    - class: "pack_untrusted"
      detection: "PackTrust signature/approval state."
      response: "Typed diagnostic; no automatic remediation offered."
    - class: "integration_unavailable"
      detection: "Probe or query failure/timeout."
      response: "Typed IntegrationState, reported once at workspace level. Never an error on a declaration."
    - class: "version_skew"
      detection: "schema_version / canonicalization_version outside supported set."
      response: "Disable the affected tier with an explicit incompatibility message. MUST NOT attempt best-effort interpretation."
    - class: "panic_in_a_handler"
      detection: "Runtime."
      response: "Isolate: the request fails, the server survives. A panic MUST NOT terminate the session."

  safe_failure_requirements:
    - "Failure of any optional tier MUST leave representation-tier behavior bit-identical."
    - "Every failure MUST be attributable to a source, never rendered as an unexplained absence."
    - "The server MUST NOT retry an external command automatically more than a bounded number of times, and MUST back off."

  unsafe_behaviors:
    - "Falling back to heuristic name matching when canonical identity is unavailable."
    - "Presenting an unavailable integration as an empty result."
    - "Publishing observation or evaluation findings as Error-severity diagnostics."
    - "Executing anything during a passive request."
    - "Writing to the RealityTrace ledger."

  recoverable_failures:
    - "Envelope resolution failure — recovers on the next successful edit."
    - "sxr timeout — recovers on the next enrichment cycle."
    - "Config error — recovers on didChangeConfiguration."

  nonrecoverable_or_operator_required:
    - "domainforge-core version incompatibility — requires a dependency update."
    - "Missing span sidecar — requires the upstream DF-C3 change."
    - "Missing declaration-keyed sxr query — requires SXR-C1."

# -----------------------------------------------------------------------------
# 18. SECURITY, SAFETY, TRUST BOUNDARIES
# -----------------------------------------------------------------------------
security_safety_trust_boundaries:
  trusted_inputs:
    - "domainforge-core library return values (in-process, same trust domain)."
  untrusted_inputs:
    - ".sea source content (user/workspace-controlled)."
    - "Semantic pack files (verify trust state; do not assume signature validity)."
    - "Workspace configuration files (may set binary paths — REQ-SEC-006)."
    - "sxr JSON output (parse defensively; malformed output MUST be an error, never coerced into a valid state — the discipline sxr-df already applies)."
  trusted_actors:
    - "The user issuing an explicit executeCommand."
  privileged_operations:
    - "Spawning the sxr binary."
    - "Writing workspace files (code action edits, regeneration)."
    - "Rebuilding semantic packs."
  mandatory_requirements:
    - "REQ-SEC-001 (no side effects on passive requests) is the primary security invariant of this design."
    - "Path access confined to declared workspace roots, reusing the guardrails.rs canonicalization discipline."
    - "Rate limiting on any background external query."
    - "No network access from the server."
  secret_handling:
    - "The server handles no secrets. It MUST NOT read credential files and MUST NOT log source content."
  authorization_requirements:
    - "The LSP holds no authority. It MUST NOT infer permission from the ability to invoke a command. Access is not capability — this is CEP's own distinction and the LSP must honour it."

  trust_boundary_diagram:
    mermaid: |-
      flowchart LR
        U["User action\n(executeCommand)"] -->|explicit| GOV["Governed execution"]
        P["Passive requests\n(hover, diagnostics, lens)"] -->|"MUST be side-effect free"| RO["Read-only projection"]
        RO --> CACHE["In-memory caches"]
        GOV --> FS["Workspace files"]
        GOV --> PROC["sxr (read-only) / pack rebuild"]
        RO -.->|"never"| FS
        RO -.->|"never"| PROC

# -----------------------------------------------------------------------------
# 19. VALIDATION MATRIX
# -----------------------------------------------------------------------------
validation_matrix:
  core_conformance:
    - area: "Outcome"
      test: "Multi-module fixture workspace; resolve envelope; assert declaration set, import graph, and resolved_references match a golden file."
      expected: "Exact match."
      evidence: "tests/fixtures/workspace_multi_module/, golden JSON."

    - area: "Canonical parity (anti-drift)"
      test: "In-process resolve_semantic_envelope_with_packs vs `domainforge envelope --emit both` on the same sources."
      expected: "Identical semantic_closure_hash."
      evidence: "Parity test; this is the gate that would have caught the 2026-06 break."

    - area: "Determinism"
      test: "Resolve the same source map 20 times, and in randomized file order."
      expected: "Identical semantic_closure_hash every time."
      evidence: "Determinism test."

    - area: "Identity stability"
      test: "Format the fixture (whitespace only); move a file preserving logical_module_id; add a comment."
      expected: "No DeclarationKey changes; no closure hash change."
      evidence: "Identity stability test — settles REQ-ID-003/004."

    - area: "Identity sensitivity"
      test: "Rename a concept; change its namespace."
      expected: "DeclarationKey changes, and the ConceptChange affordance appears."
      evidence: "Identity sensitivity test — settles REQ-ID-005."

    - area: "Cross-repo key equality"
      test: "For each declaration in the fixture, assert the LSP's DeclarationKey string equals sxr DeclKey::as_str() for the same declaration."
      expected: "Byte equality."
      evidence: "Cross-repo test. If this fails the whole observation tier is nominal only."

    - area: "Input validation"
      test: "Malformed .sea; source map exceeding the budget; non-UTF8; a 10k-line file."
      expected: "Typed diagnostics; no panic; T0 still serves."
      evidence: "Robustness tests."

    - area: "Config errors"
      test: "Missing entry; unreadable pack; sxr binary path pointing at a nonexistent file."
      expected: "Typed IntegrationState per tier; correct blast radius; server survives."
      evidence: "Config error tests."

    - area: "Startup/preflight"
      test: "initialize with sxr absent."
      expected: "initialize returns promptly with capabilities and honest tier states; no blocking."
      evidence: "Protocol test."

    - area: "State transitions"
      test: "Break the model mid-session, then repair it."
      expected: "representation -> degraded(stale envelope retained) -> representation. Navigation never fully disappears."
      evidence: "Lifecycle test — settles REQ-IDX-006."

    - area: "Failure handling"
      test: "sxr returns malformed JSON; sxr hangs past the timeout; sxr exits nonzero."
      expected: "Distinct typed states (error / timeout / error), no model diagnostics, no hang."
      evidence: "Adapter failure tests."

    - area: "Observability"
      test: "Run a session; inspect logs and domainforge/status."
      expected: "Resolution timings, hashes, cache stats present; no source content in logs."
      evidence: "Log assertion test."

    - area: "Security/safety"
      test: "Issue every passive request type against a workspace with a process-execution tripwire installed."
      expected: "Zero process spawns, zero file writes."
      evidence: "Side-effect-freedom test — the primary security gate (REQ-SEC-001)."

    - area: "Affordance gating"
      test: "Construct a workspace where each gated affordance's gate is unsatisfied."
      expected: "No such action appears in the codeAction list as available."
      evidence: "Gate enforcement test — settles REQ-AFF-002."

    - area: "Epistemic typing"
      test: "A model with an unmet evidence obligation and a residual."
      expected: "Diagnostics have source realitytrace.* / evaluation.*, severity <= Information, and carry semantic_truth; none are Error."
      evidence: "Diagnostic taxonomy test — settles REQ-DIAG-002."

  variation_and_recovery:
    - case: "sxr present but the repo is not enrolled."
      why: "Distinguishes 'no data' from 'not configured'; the most common real-world state."
      expected: "IntegrationState::not_configured with an actionable reason, not an empty evidence list."
      evidence: "Degraded-mode test."

    - case: "Envelope resolves with diagnostics (exit-1-but-valid shape)."
      why: "observed — sxr-df documents this exact trap: classification must be by shape, not exit code."
      expected: "Treated as Resolved; navigation works; diagnostics published."
      evidence: "Shape classification test."

    - case: "Pack set changes without a source change."
      why: "Meaning can change with no edit — the case that motivates AFF-MEANING-CHANGED."
      expected: "Envelope re-resolves (pack_set_hash changed); pack diagnostics update."
      evidence: "Pack invalidation test."

    - case: "Two declarations with identical content in one module."
      why: "Exercises Occurrence{content_hash, duplicate_index} identity."
      expected: "Distinct DeclarationKeys with correct duplicate_index; stable across re-resolution."
      evidence: "Occurrence identity test."

    - case: "File changed on disk outside the editor."
      why: "Index staleness is silent without watched-file handling."
      expected: "Envelope invalidates and re-resolves."
      evidence: "Watched files test."

  real_integration_condition: >-
    Observation-tier and evaluation-tier claims MUST NOT be marked
    evidence_backed on mocks alone. Real integration (an actual sxr binary with
    an enrolled repo and a committed semantic.snapshot) is REQUIRED before any
    T3/T4 capability is claimed complete.

  real_integration_tests:
    - "Enroll a fixture repo in a real sxr ledger, create a snapshot, and assert the LSP's DeclarationKey retrieves the expected records."
    - "Advance the model, re-snapshot, and assert the LSP correctly marks prior observations stale."

  skipped_test_rule: >-
    Skipped REQUIRED integration tests MUST be reported as skipped, not passed,
    and MUST prevent final conformance.

# -----------------------------------------------------------------------------
# 20. IMPLEMENTATION DEFINITION OF DONE
# -----------------------------------------------------------------------------
implementation_definition_of_done:
  - "The crate builds, tests, and clippy-passes against a version-constrained domainforge-core."
  - "The canonical-parity and determinism gates pass."
  - "No grammar, resolution, or hashing logic exists in the LSP; the anti-duplication CI gate passes."
  - "DeclarationKey identity stability and sensitivity tests pass, and byte-equality with sxr DeclKey is demonstrated."
  - "Every LSP handler obtains its answer from the SemanticQuery facade; no handler contains semantic logic."
  - "The diagnostic taxonomy is enforced by type, not convention, and the epistemic typing test passes."
  - "Degraded-mode tests pass with each optional integration independently absent, with typed reasons."
  - "The side-effect-freedom test passes for every passive request."
  - "Every affordance carries a gate, and the gate enforcement test passes."
  - "Observation/evaluation claims are marked partially_proven until real-integration tests run."
  - "Capability classifications in the matrix are honoured: nothing marked not_semantically_meaningful is implemented."
  - "A cold developer or agent can answer every spec_frame quality-gate question from this file alone."

# -----------------------------------------------------------------------------
# 21. ROADMAP BOUNDARIES
# -----------------------------------------------------------------------------
roadmap_boundaries:
  incremental_envelope_resolution:
    level: roadmap
    future_shape: "DF-C4: a partial/incremental resolution API in domainforge-core."
    current_requirement: "Only that the LSP isolate resolution behind L2 so it can be swapped, and that REQ-PERF-006 measurement happens."

  live_evaluation_from_the_editor:
    level: roadmap
    future_shape: "A governed 'run the smallest relevant proof' action driving sxr's plan/run/verify machinery."
    current_requirement: "Only that the affordance model can express requires_authority and governed execution. No such action is implemented now — no authority boundary for it has been designed (OQ-6)."

  rename_as_conceptchange:
    level: roadmap
    future_shape: "A rename flow that generates a ConceptChange and migration policy instead of a text substitution."
    current_requirement: "That plain rename is NOT offered, and that the MCP rename-preview tool is withdrawn."

  multi_root_workspaces:
    level: roadmap
    future_shape: "Multiple entry points / workspace folders."
    current_requirement: "That entry resolution is a single audited function with a deterministic, reported choice (OQ-3)."

  lsp_crate_migration:
    level: roadmap
    future_shape: "Migration off tower-lsp 0.20 if maintenance becomes a risk."
    current_requirement: "That L9 is a thin mechanical layer, so the protocol crate is replaceable."

# -----------------------------------------------------------------------------
# 22. OPEN QUESTIONS
# -----------------------------------------------------------------------------
open_questions:
  - id: OQ-1
    question: "Will DomainForge accept the span sidecar (DF-C3) as an out-of-envelope structure?"
    status: RESOLVED
    resolution: >-
      Accepted by the maintainer (2026-09-03), who owns domainforge, sxr,
      domainforge-lsp and domainforge-vsc-extension. The sidecar is implemented
      OUTSIDE the hashed envelope payload, preserving semantic_closure_hash
      invariance under formatting. DF-C3 is therefore not an external dependency
      but a sequenced task in this plan's own scope.
    binding_constraint_retained: >-
      Maintainer ownership removes the negotiation, NOT the engineering
      constraint. The hash-invariance test and the cross-repo DeclKey
      byte-equality test remain REQUIRED. Owning both repositories makes it
      easier, not safer, to accidentally couple them.

  - id: OQ-2
    question: "Does `sxr query evidence --entity` accept a DeclKey string today, or a different entity notion?"
    status: RESOLVED_MOOT
    resolution: >-
      observed — the question is superseded by a more serious finding.
      commands.rs:2378 `query_evidence` calls `projections::rebuild()` before
      answering, so it writes. Whatever `entity` accepts, the LSP cannot call
      this command. SXR-C1 is therefore a NEW read-only command, not a
      validation of the existing one. See CLAIM-009.

  - id: OQ-3
    question: "How is the workspace entry point determined when a workspace has several .sea roots?"
    status: RESOLVED
    resolution: >-
      observed — domainforge-core/src/cli/envelope.rs establishes the pattern:
      `EnvelopeArgs { target: PathBuf }` (a single target file), then
      `NamespaceRegistry::discover(&target)`, then
      `registry.namespace_for(&target)` for the default namespace, then
      `source_map_from_filesystem(&target, &source, registry, default_namespace)`
      which RETURNS `(entry_logical_path, source_map)`. The entry is derived from
      a target file plus a discovered registry — it is not a workspace-global
      setting.
      observed — .sea-registry.toml carries `version`, `default_namespace`, and
      `[[namespaces]] { namespace, patterns: [glob] }`, so a workspace is
      natively multi-namespace.
      DESIGN CONSEQUENCE: the LSP MUST treat the ACTIVE DOCUMENT as the target
      and derive the entry per-document via the same registry-discovery path,
      reusing `source_map_from_filesystem` rather than inventing entry
      resolution. `domainforge.workspace.entry` (section 10) is therefore an
      OPTIONAL override, not the primary mechanism, and the config default
      changes from "implementation-defined discovery" to "derive from the active
      document via NamespaceRegistry::discover".
    residual_resolved: >-
      observed — module/resolver.rs:399 declares
      `pub(crate) fn source_map_from_filesystem(...)`. It is NOT public, so the
      LSP cannot call it today. Exposing it (and `NamespaceRegistry::discover`,
      if likewise restricted) is a small, additive, low-risk upstream change with
      no semantic content — folded into DF-C1 as DF-C1a. Without it the LSP would
      have to reimplement source-map assembly and registry discovery, which is
      precisely the duplication REQ-CANON-003 forbids.

  - id: OQ-4
    question: "What is the actual latency of full envelope resolution on a representative workspace?"
    why_it_matters: "Decides whether DF-C4 is roadmap or required (REQ-PERF-006, CLAIM-010)."
    status: unknown
    resolution_path: "Measured in plan task T05."

  - id: OQ-5
    question: "Do generated projection artifacts record the semantic_closure_hash they were generated from?"
    status: RESOLVED_PARTIAL
    resolution: >-
      observed — provenance exists but is NOT uniform across the ~25 projection
      targets, and is not the semantic_closure_hash.
      archimate/mod.rs stamps an XML comment via `with_provenance(body,
      model_ref, created_at)` — a model_ref label plus a timestamp.
      baml/render.rs and dspy/render.rs emit "Provenance: capability id `{cap}`,
      source model hash `{hash}`" — a source model hash.
      projection/ai_learning/provenance.rs defines a `Provenance` type carried
      verbatim into dspy IR.
      Other targets show no provenance stamp at all.
    design_consequence: >-
      AFF-STALE-PROJECTION MUST be scoped to targets that actually carry a source
      hash, and MUST report `unknown` staleness for the rest. It MUST NOT infer
      staleness from file mtime or regeneration order — that would assert a
      correspondence the artifact does not record. Uniform closure-hash stamping
      across projection targets is a reasonable upstream ask, but it is a
      DomainForge concern and is NOT added to this plan.

  - id: OQ-6
    question: "Which authority governs running a verification from the editor?"
    status: RESOLVED_DEFERRED
    resolution: >-
      Deliberately deferred past T15 (evaluation projection) by maintainer
      decision (2026-09-03). Nothing in the plan up to that point depends on it.
      'Run the verification' and 'create a snapshot' remain classified
      unavailable/future under REQ-AFF-006 and MUST NOT appear as code actions.
    revisit_trigger: >-
      After the evaluation projection ships and there is real usage evidence that
      the affordance is wanted. Designing an authority model before that evidence
      exists would be speculative. This is a deferral, not a rejection: if the
      answer later is 'the editor never runs verifications', that is a legitimate
      outcome and simply makes the current classification permanent.

  - id: OQ-7
    question: "Is the VS Code extension actively maintained, and are coordinated releases available?"
    status: RESOLVED
    resolution: >-
      observed — yes, there is a real release pipeline. The extension reached
      v0.1.0, publishes to the Open VSX Registry, and has
      .github/workflows/release.yml plus ci.yml. Coordinated releases ARE
      available, so REQ-COMPAT-003 is a choice rather than a hard constraint.

  - id: OQ-8
    question: "Should the LSP consume domainforge-core via path dependency or a published crate version?"
    status: RESOLVED
    resolution: >-
      observed — domainforge-core IS published to crates.io.
      .github/workflows/release-crates.yml runs `cargo publish --manifest-path
      domainforge-core/Cargo.toml`, deploy.yml has a "Publish domainforge-core to
      crates.io" job, and .release-please-manifest.json tracks
      domainforge-core 0.16.0 alongside the python and typescript packages.
      RECOMMENDATION: depend on the PUBLISHED crate with a caret constraint
      (`domainforge-core = "0.16"`), not a path. A published version is
      structurally immune to the upstream rename/move that caused this outage,
      because a version cannot be deleted from under the LSP. Retain the
      upstream-compat CI job (REQ-COMPAT-005) building against domainforge HEAD
      to surface breakage EARLY, and use a `[patch.crates-io]` entry for local
      co-development when needed. This gets loud early warning without
      reintroducing the fragile structural coupling.

# -----------------------------------------------------------------------------
# 23. CONFORMANCE TRACEABILITY
# -----------------------------------------------------------------------------
conformance_traceability:
  high_risk_requirement_groups:
    - group: "Semantic identity"
      requirements: ["REQ-ID-001", "REQ-ID-002", "REQ-ID-003", "REQ-ID-004", "REQ-ID-005", "REQ-ID-007"]
      confirmation: "adversarial"
      why: "Everything downstream joins on this. A wrong key silently produces confident, wrong cross-system answers."

    - group: "Canonical non-duplication"
      requirements: ["REQ-CANON-002", "REQ-CANON-003", "REQ-CANON-004", "REQ-COMPAT-005"]
      confirmation: "independent"
      why: "This is the exact failure that broke the repository. It must be mechanically prevented, not remembered."

    - group: "Epistemic typing and anti-collapse"
      requirements: ["REQ-DIAG-002", "REQ-DIAG-003", "REQ-EVAL-003", "REQ-EVAL-004", "REQ-EVAL-005", "REQ-DEG-004"]
      confirmation: "adversarial"
      why: "The tool exists to preserve distinctions; collapsing them here would be self-defeating and is easy to do accidentally."

    - group: "Passive side-effect freedom"
      requirements: ["REQ-SEC-001", "REQ-SEC-002", "REQ-OBS-001", "REQ-OBS-003"]
      confirmation: "adversarial"
      why: "An editor that executes on hover is a security defect with a very wide blast radius."

    - group: "Affordance gating"
      requirements: ["REQ-AFF-001", "REQ-AFF-002", "REQ-AFF-003", "REQ-AFF-004", "REQ-AFF-006"]
      confirmation: "peer"
      why: "Presenting a gated action as available converts governance into a suggestion."

  plan_projection_rule: >-
    Every REQUIRED normative requirement MUST map to at least one plan task.
    Every settlement-critical task MUST declare the requirement IDs it settles,
    its proof level, evidence location, and confirmation mode. A requirement
    without a plan task or settled evidence remains open.
