name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: domainforge-lsp-linux-x64
            
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: domainforge-lsp-windows-x64
            extension: .exe
            
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: domainforge-lsp-darwin-x64
            
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: domainforge-lsp-darwin-arm64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: domainforge-lsp

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            domainforge-lsp/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('domainforge-lsp/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release
        working-directory: domainforge-lsp
        run: cargo build --release --target ${{ matrix.target }} -p domainforge-lsp

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp domainforge-lsp/target/${{ matrix.target }}/release/domainforge-lsp artifacts/${{ matrix.artifact_name }}
          cp domainforge-lsp/target/${{ matrix.target }}/release/domainforge-mcp artifacts/${{ matrix.artifact_name }}-mcp

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy domainforge-lsp\target\${{ matrix.target }}\release\domainforge-lsp.exe artifacts\${{ matrix.artifact_name }}.exe
          copy domainforge-lsp\target\${{ matrix.target }}\release\domainforge-mcp.exe artifacts\${{ matrix.artifact_name }}-mcp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
